services:
  db:
    image: ghcr.io/dc-77/vectiscan/postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: vectiscan
      POSTGRES_USER: vectiscan
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docs/DB-SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectiscan"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: ghcr.io/dc-77/vectiscan/redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # S0a: siehe docker-compose.yml -- Docker Hub liefert minio/minio nicht
    # mehr aus, quay.io seit dem 24.09.2026 nur mit Anmeldung. Derselbe Digest
    # wie in Produktion aus dem eigenen Registry, damit lokal und Prod dieselbe
    # MinIO-Version laufen (RELEASE.2025-09-07T16-13-09Z). Alle Abbilder hier
    # liegen unter ghcr.io/dc-77/vectiscan/ (privat): vorher docker login ghcr.io.
    image: ghcr.io/dc-77/vectiscan/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  minio-data:
