# =============================================================================
# OPS-RENDER-V3 (S4) — Bericht im Renderer v3 bauen, ohne einen Auftrag anzufassen
# =============================================================================
# Baut im laufenden report-worker aus dem Roh-Tar einer bestehenden Order Fakten,
# Pruefkatalog, Reportdaten und PDF und legt das Ergebnis unter scan-debug/v3/ ab.
#
# Was der Job NICHT tut: Order-Status aendern, eine Zeile in `reports` schreiben,
# etwas in scan-reports legen oder ein Sprachmodell aufrufen. Der Kundenbericht der
# Order bleibt, wie er ist. Damit ist der Job auf Produktion gefahrlos und die
# Abnahme von S4 ("ein Staging-Report mit LAYOUT=v3 liegt in MinIO") erfuellbar,
# ohne die Umschaltung aus S6 vorzuziehen.
#
# Nutzung: Pipeline mit der Variablen RENDER_ORDER_ID=<uuid> ausloesen, dann diesen
# Job manuell starten. Das PDF kommt zusaetzlich als Job-Artefakt zurueck; bei
# grossen Berichten kann der Upload an der 413-Grenze von git-extern scheitern, der
# Objektpfad in MinIO steht dann trotzdem im Log.
# =============================================================================
ops-render-v3:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - render-v3/
  script:
    - test -n "${RENDER_ORDER_ID}" || { echo "RENDER_ORDER_ID fehlt (Order-UUID als Pipeline-Variable setzen)"; exit 1; }
    - mkdir -p ${CI_PROJECT_DIR}/render-v3
    - cd ${DEPLOY_PATH}
    # Issue #24: Speicherbedarf mitschreiben. Der Container ist auf 1 GB begrenzt und
    # WeasyPrint dekodiert die Bildnachweise zum Setzen. Die Messung laeuft neben dem
    # Render und darf ihn nicht kippen, deshalb alles fail-open.
    - CID=$(docker compose ps -q report-worker)
    - ( while true; do docker stats --no-stream --format '{{.MemUsage}};{{.MemPerc}};{{.CPUPerc}}' "${CID}" >> ${CI_PROJECT_DIR}/render-v3/stats-${RENDER_ORDER_ID}.txt 2>/dev/null || true; sleep 2; done ) &
    - STATS_PID=$!
    # S5: RENDER_PROSE=ja zieht den Kundenkontext aus der Datenbank und laesst
    # die Prosa-KI mitlaufen. Auftrag, Status und reports bleiben unberuehrt.
    - KI=""
    - if [ "${RENDER_PROSE}" = "ja" ]; then KI="--context --prose"; fi
    - docker compose exec -T report-worker python3 -m reporter.pdf.v3
        --order "${RENDER_ORDER_ID}"
        -o "/tmp/${RENDER_ORDER_ID}-v3.pdf"
        ${KI}
        --upload
    - kill ${STATS_PID} 2>/dev/null || true
    - echo "=== Speicher report-worker waehrend des Renders ==="
    # Kein ": " im Ausdruck, YAML wuerde das als Zuordnung lesen.
    - awk -F';' '{gsub("%","",$2); if ($2+0>m) {m=$2+0; z=$0}} END {print "Spitze " z; print "Messpunkte " NR}' ${CI_PROJECT_DIR}/render-v3/stats-${RENDER_ORDER_ID}.txt || true
    - docker compose cp "report-worker:/tmp/${RENDER_ORDER_ID}-v3.pdf" ${CI_PROJECT_DIR}/render-v3/ || echo "Kopie ins Artefakt fehlgeschlagen, PDF liegt in MinIO"
    - docker compose exec -T report-worker rm -f "/tmp/${RENDER_ORDER_ID}-v3.pdf"
    - ls -l ${CI_PROJECT_DIR}/render-v3/ || true

# =============================================================================
# OPS-GATE-BLOCKED (S5) — Abnahme des Berichts-Gates.
#
# Faehrt das Gate gegen eine vorhandene Order und beschaedigt die Reportdaten
# dabei gezielt im Speicher (nie ein Tar, nie eine Faktendatei). Ohne
# GATE_APPLY wird nur ausgegeben; mit GATE_APPLY=ja landet die Order auf
# report_blocked und die Defektliste ist im Admin-Review sichtbar.
#
# Zurueck geht es ueber den Knopf "Regenerieren nach Fix" im Admin-Review.
#
# Pipeline-Variablen:
#   GATE_ORDER_ID  Order-UUID (nur eigene Nachweis-Orders, nie ein Kunde)
#   GATE_DAMAGE    abdeckung | tech | ids | keine   (Vorgabe: abdeckung)
#   GATE_APPLY     ja, um Status und Defektliste zu schreiben
#   GATE_RESEARCH  ja, um zusaetzlich die Recherche-KI laufen zu lassen
# =============================================================================
ops-gate-blocked:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-blocked/
  script:
    - test -n "${GATE_ORDER_ID}" || { echo "GATE_ORDER_ID fehlt (Order-UUID als Pipeline-Variable setzen)"; exit 1; }
    - mkdir -p ${CI_PROJECT_DIR}/gate-blocked
    - cd ${DEPLOY_PATH}
    - DAMAGE="${GATE_DAMAGE:-abdeckung}"
    - APPLY=""
    - if [ "${GATE_APPLY}" = "ja" ]; then APPLY="--apply"; fi
    - RESEARCH=""
    - if [ "${GATE_RESEARCH}" = "ja" ]; then RESEARCH="--research"; fi
    - echo "Gate gegen ${GATE_ORDER_ID}, Beschaedigung ${DAMAGE}, Schreiben ${GATE_APPLY:-nein}, Recherche ${GATE_RESEARCH:-nein}"
    # Exit 1 heisst "Defekte gefunden" und ist hier das erwartete Ergebnis.
    - docker compose exec -T report-worker python3 -m reporter.gate
        --order "${GATE_ORDER_ID}"
        --damage "${DAMAGE}"
        ${RESEARCH}
        ${APPLY}
        > ${CI_PROJECT_DIR}/gate-blocked/${GATE_ORDER_ID}-${DAMAGE}.json || true
    - head -c 2000 ${CI_PROJECT_DIR}/gate-blocked/${GATE_ORDER_ID}-${DAMAGE}.json
    - echo ""
    - docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc
        "SELECT status FROM orders WHERE id = '${GATE_ORDER_ID}'"

# =============================================================================
# OPS-UPDATE-PAGES (S6) — Seitenerwartungen neu schreiben.
#
# tests/golden/render/expected-pages.json haelt je Golden-Auftrag die Seitenzahl
# und die bekannten halbleeren Seiten (S4). Jede inhaltliche Aenderung am
# Bericht verschiebt diese Zahlen, und `python -m reporter.pdf.v3 --update-pages`
# braucht WeasyPrint samt Pango. Das liegt weder auf dem Runner (Shell-Executor)
# noch unter Windows, sondern nur im report-worker-Abbild.
#
# Bis S6 gab es deshalb keinen Weg, die Datei ohne eine eigene Linux-Umgebung
# neu zu schreiben; die Zahlen wurden aus dem Fehlertext des Selbsttests
# abgetippt. Dieser Job rendert alle Golden-Auftraege im Abbild des Commits und
# legt die Datei in die Artefakte. Von dort nach tests/golden/render/ kopieren,
# die Abweichung im Commit begruenden, fertig.
#
# Manuell, weil er nur bei einer gewollten Layout- oder Textaenderung gebraucht
# wird, und `needs: [build-report-worker]`, damit er nicht auf Trivy und die
# Testphase wartet.
# =============================================================================
ops-update-pages:
  stage: ops
  tags: [vectigal]
  needs: [build-report-worker]
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - render-pages/
  script:
    - mkdir -p ${CI_PROJECT_DIR}/render-pages
    # --update-pages schreibt in den Abbild-Pfad; der Container ist ein
    # Wegwerfcontainer, deshalb danach herauskopieren.
    # --user root, weil /app dem Abbild-Root gehoert und --update-pages in
    # tests/golden/render/ schreibt (wie der pytest-Schritt in
    # test-report-worker-pdf).
    - CID=$(docker create --user root -e VECTISCAN_REQUIRE_WEASYPRINT=1
        ${BASE_IMAGE}/report-worker:${CI_COMMIT_SHORT_SHA}
        python3 -m reporter.pdf.v3 --update-pages)
    - docker start -a "${CID}" 2>&1 | tee ${CI_PROJECT_DIR}/render-pages/update-pages.log
    - docker cp "${CID}:/app/tests/golden/render/expected-pages.json"
        ${CI_PROJECT_DIR}/render-pages/expected-pages.json
    - docker rm -f "${CID}" >/dev/null
    - echo "=== expected-pages.json ==="
    - cat ${CI_PROJECT_DIR}/render-pages/expected-pages.json

# =============================================================================
# OPS-FACTS-PROD (S5b) — kommt die Faktenschicht im Produktionspfad an?
#
# Zwei Betriebsarten, beide gegen die echte Datenbank und das echte Roh-Tar:
#
#   lesend (Vorgabe)  python -m reporter.pdf.v3 --kennzahlen --order <id>
#       Laedt Tar aus MinIO und die scan_results-Zeilen ueber _load_tool_runs,
#       baut Fakten, Katalog und Reportdaten und meldet Abdeckung je Host,
#       TLS-Protokolle, Anhang A.3, Gate-Defekte, Laufzeit und Speicher.
#       Schreibt nichts an Auftrag, reports oder Defektliste. Fuer jeden
#       Auftrag zulaessig, auch fuer ausgelieferte Kundenauftraege.
#
#   voll (FACTS_MODE=voll)  python -m reporter.worker --once --order <id>
#       Vollstaendiger Produktionspfad mit VECTISCAN_REPORT_LAYOUT=v3, also
#       inklusive PDF-Upload, reports-Zeile, Statuswechsel und KI-Aufrufen.
#       Nur fuer die internen Nachweisauftraege (INTERNE_ORDERS in worker.py);
#       zusaetzlich FACTS_CONFIRM=intern noetig. Ein ausgelieferter
#       Kundenauftrag bekommt keinen Lauf von Hand (Entscheidung DC, S5b).
#
# Der Env-Wert muss an "docker compose exec" uebergeben werden, geerbt wird er
# nicht; ohne -e gilt der Compose-Wert v2.
#
# Pipeline-Variablen:
#   FACTS_ORDER_ID  Order-UUID
#   FACTS_MODE      lesend | voll          (Vorgabe: lesend)
#   FACTS_CONFIRM   intern                 (nur fuer FACTS_MODE=voll)
#   FACTS_EXPORT    ja, um facts.json und catalog.json nach scan-rawdata zu legen
#   FACTS_RENDER    ja, um lesend zusaetzlich ein PDF nach scan-debug/v3/ zu legen
#   FACTS_NO_AI     ja, um mit leerem ANTHROPIC_API_KEY zu fahren (S6-Nachweis:
#                   derselbe Bericht ohne Prosa und ohne Recherche)
#
# Seit S6 gilt im Container ohnehin VECTISCAN_REPORT_ENGINE=catalog und
# VECTISCAN_REPORT_LAYOUT=v3; das -e beim Vollmodus bleibt als Absicherung.
# Das gerenderte PDF liegt zusaetzlich in den Job-Artefakten unter facts-prod/,
# damit es ohne MinIO-Zugang lesbar ist.
# =============================================================================
ops-facts-prod:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - facts-prod/
  script:
    - test -n "${FACTS_ORDER_ID}" || { echo "FACTS_ORDER_ID fehlt (Order-UUID als Pipeline-Variable setzen)"; exit 1; }
    - mkdir -p ${CI_PROJECT_DIR}/facts-prod
    - cd ${DEPLOY_PATH}
    - MODE="${FACTS_MODE:-lesend}"
    - EXPORT=""
    - if [ "${FACTS_EXPORT}" = "ja" ]; then EXPORT="-e VECTISCAN_FACTS_EXPORT=1"; fi
    # S6: Nachweis, dass der Bericht ohne Sprachmodell vollstaendig ist. Ein
    # leerer Schluessel laesst Prosa und Recherche leer durchlaufen; die Befunde
    # und alle Zahlen kommen aus dem Pruefkatalog und aendern sich nicht.
    - NOAI=""
    - if [ "${FACTS_NO_AI}" = "ja" ]; then NOAI="-e ANTHROPIC_API_KEY="; fi
    - echo "Order ${FACTS_ORDER_ID}, Betriebsart ${MODE}, Export ${FACTS_EXPORT:-nein}, ohne KI ${FACTS_NO_AI:-nein}"
    # Ausgangslage festhalten, damit ein Schreiben belegbar ist.
    - docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc
        "SELECT status FROM orders WHERE id = '${FACTS_ORDER_ID}'"
        > ${CI_PROJECT_DIR}/facts-prod/status-vorher.txt || true
    - docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc
        "SELECT count(*) FROM reports WHERE order_id = '${FACTS_ORDER_ID}'"
        >> ${CI_PROJECT_DIR}/facts-prod/status-vorher.txt || true
    - cat ${CI_PROJECT_DIR}/facts-prod/status-vorher.txt
    # Speicher mitschreiben, solange der Lauf laeuft (Muster aus ops-render-v3).
    - CID=$(docker compose ps -q report-worker)
    - ( while true; do docker stats --no-stream --format '{{.MemUsage}};{{.MemPerc}}' "${CID}" >> ${CI_PROJECT_DIR}/facts-prod/stats-${FACTS_ORDER_ID}.txt 2>/dev/null || true; sleep 2; done ) &
    - STATS_PID=$!
    - |
      if [ "${MODE}" = "voll" ]; then
        docker compose exec -T \
          -e VECTISCAN_REPORT_LAYOUT=v3 \
          -e VECTISCAN_ONCE_CONFIRM="${FACTS_CONFIRM}" \
          ${EXPORT} ${NOAI} \
          report-worker python3 -m reporter.worker --once --order "${FACTS_ORDER_ID}" \
          2>&1 | tee ${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-voll.log
        # S6: Den eben gebauten Bericht zusaetzlich in die Job-Artefakte legen.
        # Der Worker laedt ihn nach MinIO und raeumt sein Arbeitsverzeichnis auf,
        # deshalb wird er hier ueber den Ops-Weg noch einmal gerendert (ohne
        # --upload, ohne DB-Schreibzugriff) statt aus dem Bucket geholt.
        #
        # --context und --prose sind Pflicht, sonst ist das Artefakt nicht der
        # ausgelieferte Bericht: ohne --context steht "Auftraggeber" statt des
        # Firmennamens auf dem Deckblatt, ohne --prose fehlen die vier
        # KI-Absaetze. Genau das ist bei der ersten Abnahme passiert.
        docker compose exec -T ${NOAI} report-worker python3 -m reporter.pdf.v3 \
          --order "${FACTS_ORDER_ID}" --context --prose \
          -o "/tmp/${FACTS_ORDER_ID}-v3.pdf" \
          2>&1 | tee ${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-render.log || true
        docker compose cp \
          "report-worker:/tmp/${FACTS_ORDER_ID}-v3.pdf" \
          "${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-v3.pdf" || true
        docker compose exec -T report-worker rm -f "/tmp/${FACTS_ORDER_ID}-v3.pdf" || true
      else
        docker compose exec -T ${EXPORT} ${NOAI} report-worker python3 -m reporter.pdf.v3 \
          --kennzahlen --order "${FACTS_ORDER_ID}" \
          > ${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-kennzahlen.json || true
        cat ${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-kennzahlen.json
        if [ "${FACTS_RENDER}" = "ja" ]; then
          docker compose exec -T ${NOAI} report-worker python3 -m reporter.pdf.v3 \
            --order "${FACTS_ORDER_ID}" --context --prose \
            -o "/tmp/${FACTS_ORDER_ID}-v3.pdf" --upload \
            2>&1 | tee ${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-render.log || true
          # S6: Das PDF liegt sonst nur in scan-debug im MinIO, und wer es
          # gegenlesen soll, braucht dafuer einen Bucket-Zugang. Jetzt haengt es
          # an den Job-Artefakten (facts-prod/), wie die Logs daneben.
          docker compose cp \
            "report-worker:/tmp/${FACTS_ORDER_ID}-v3.pdf" \
            "${CI_PROJECT_DIR}/facts-prod/${FACTS_ORDER_ID}-v3.pdf" || true
          docker compose exec -T report-worker rm -f "/tmp/${FACTS_ORDER_ID}-v3.pdf" || true
        fi
      fi
    - kill ${STATS_PID} 2>/dev/null || true
    - awk -F';' '{gsub("%","",$2); if ($2+0>m) {m=$2+0; z=$0}} END {print "Spitze " z; print "Messpunkte " NR}' ${CI_PROJECT_DIR}/facts-prod/stats-${FACTS_ORDER_ID}.txt || true
    - docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc
        "SELECT status FROM orders WHERE id = '${FACTS_ORDER_ID}'"
    - docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc
        "SELECT count(*) FROM reports WHERE order_id = '${FACTS_ORDER_ID}'"
    - ls -l ${CI_PROJECT_DIR}/facts-prod/ || true

# =============================================================================
# Abo-Statusbericht (Issue #29, S6a)
# =============================================================================
# Der Statusbericht-Job ist seit seiner Einfuehrung (cecd662, 03.05.2026) nie
# durchgelaufen. Der Scheduler (api/src/lib/scheduler.ts) stellt ihn trotzdem
# jede Minute je faelligem Abo ein; ein Fehlschlag steht nur im Worker-Log,
# nicht in der Datenbank.
#
#   diag (Vorgabe)  nur lesend: aktive Abos mit Kunde, Intervall und
#       last_status_report_at, erzeugte Berichte je Abo, Anforderungen aus dem
#       Kundenportal (audit_log), Queue-Tiefe, Fehlschlaege im Worker-Log und
#       Einreihungen im API-Log. Laeuft auch in der MR-Pipeline, damit der
#       Stand vor dem Deploy des Fixes festgehalten wird (das Worker-Log endet
#       mit dem Neustart des Containers).
#
#   erzeugen  python -m reporter.status_report_generator --subscription <id>
#       Derselbe Weg wie der Queue-Job: PDF nach MinIO, Zeile in
#       subscription_status_reports, last_status_report_at gesetzt. Das PDF
#       liegt zusaetzlich im Job-Artefakt. Zugestellt wird nichts; einen
#       Kundenweg fuer den Statusbericht gibt es noch nicht.
#
# Pipeline-Variablen:
#   STATUS_MODE             diag | erzeugen    (Vorgabe: diag)
#   STATUS_SUBSCRIPTION_ID  subscriptions.id    (nur fuer erzeugen)
# =============================================================================
ops-status-report:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - status-report/
  script:
    - mkdir -p ${CI_PROJECT_DIR}/status-report
    - test -n "${DEPLOY_PATH}" || { echo "DEPLOY_PATH fehlt in dieser Pipeline (geschuetzte Variable?)"; exit 1; }
    - cd ${DEPLOY_PATH}
    - MODE="${STATUS_MODE:-diag}"
    - echo "Betriebsart ${MODE}"
    - |
      if [ "${MODE}" = "diag" ]; then
        docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -A -X -F ' | ' \
          <<'SQL' | tee ${CI_PROJECT_DIR}/status-report/diag-db.txt
      \echo === Abos (alle Status) mit Statusbericht-Stand ===
      SELECT s.id, s.status, s.package, s.scan_interval,
             to_char(s.created_at, 'YYYY-MM-DD') AS angelegt,
             to_char(s.started_at, 'YYYY-MM-DD') AS gestartet,
             to_char(s.expires_at, 'YYYY-MM-DD') AS endet,
             s.last_status_report_at,
             c.company_name, c.email
        FROM subscriptions s JOIN customers c ON c.id = s.customer_id
       ORDER BY s.status, s.started_at NULLS LAST;
      \echo
      \echo === Vom Scheduler erfasst (aktiv, Intervall gesetzt): Anzahl ===
      SELECT count(*) FROM subscriptions
       WHERE status = 'active' AND scan_interval IN ('weekly','monthly','quarterly');
      \echo
      \echo === Erzeugte Statusberichte je Abo ===
      SELECT subscription_id, count(*), min(generated_at), max(generated_at)
        FROM subscription_status_reports GROUP BY subscription_id;
      SELECT count(*) AS statusberichte_gesamt FROM subscription_status_reports;
      \echo
      \echo === Anforderungen aus dem Kundenportal (audit_log) ===
      SELECT a.created_at, a.details->>'subscriptionId' AS abo, c.company_name, c.email
        FROM audit_log a
        LEFT JOIN subscriptions s ON s.id::text = a.details->>'subscriptionId'
        LEFT JOIN customers c ON c.id = s.customer_id
       WHERE a.action = 'subscription.status_report_requested'
       ORDER BY a.created_at;
      \echo
      \echo === Posture je aktivem Abo ===
      SELECT s.id, s.status, sp.posture_score, sp.last_aggregated_at
        FROM subscriptions s LEFT JOIN subscription_posture sp ON sp.subscription_id = s.id
       WHERE s.status = 'active';
      SQL
        echo
        echo "=== Queue report-pending ==="
        docker compose exec -T redis redis-cli LLEN report-pending || true
        echo
        echo "=== report-worker: Container gestartet ==="
        docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q report-worker)" || true
        echo "=== report-worker: Statusbericht-Ereignisse seit Containerstart ==="
        docker compose logs --no-color --timestamps report-worker 2>&1 \
          | grep -E 'subscription_status_report_(failed|done)|status_report_(generated|not_due|subscription_not_found|enqueued|enqueue_failed)' \
          > ${CI_PROJECT_DIR}/status-report/worker-events.txt || true
        for ev in subscription_status_report_failed subscription_status_report_done status_report_enqueued; do
          n=$(grep -c "${ev}" ${CI_PROJECT_DIR}/status-report/worker-events.txt || true)
          echo "  ${ev}: ${n}"
        done
        echo "  erster Treffer:"; head -1 ${CI_PROJECT_DIR}/status-report/worker-events.txt | cut -c1-400 || true
        echo "  letzter Treffer:"; tail -1 ${CI_PROJECT_DIR}/status-report/worker-events.txt | cut -c1-400 || true
        echo "  Abos mit Fehlschlag (subscription_id, Anzahl):"
        grep 'subscription_status_report_failed' ${CI_PROJECT_DIR}/status-report/worker-events.txt \
          | grep -oE 'subscription_id[^0-9a-f]*[0-9a-f-]{36}' | grep -oE '[0-9a-f-]{36}' | sort | uniq -c || true
        echo
        echo "=== api: Einreihungen durch den Scheduler seit Containerstart ==="
        docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q api)" || true
        docker compose logs --no-color --timestamps api 2>&1 | grep 'Status-Report enqueued' \
          > ${CI_PROJECT_DIR}/status-report/api-enqueued.txt || true
        echo "  Einreihungen: $(wc -l < ${CI_PROJECT_DIR}/status-report/api-enqueued.txt)"
        head -1 ${CI_PROJECT_DIR}/status-report/api-enqueued.txt || true
        tail -1 ${CI_PROJECT_DIR}/status-report/api-enqueued.txt || true
        grep -oE 'subscription [0-9a-f-]{36}' ${CI_PROJECT_DIR}/status-report/api-enqueued.txt | sort | uniq -c || true
      elif [ "${MODE}" = "erzeugen" ]; then
        echo "${STATUS_SUBSCRIPTION_ID}" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
          || { echo "STATUS_SUBSCRIPTION_ID fehlt oder ist keine UUID"; exit 1; }
        docker compose exec -T report-worker python3 -m reporter.status_report_generator \
          --subscription "${STATUS_SUBSCRIPTION_ID}" \
          --pdf "/tmp/status-${STATUS_SUBSCRIPTION_ID}.pdf" \
          2>&1 | tee ${CI_PROJECT_DIR}/status-report/erzeugen.log
        docker compose cp \
          "report-worker:/tmp/status-${STATUS_SUBSCRIPTION_ID}.pdf" \
          "${CI_PROJECT_DIR}/status-report/status-${STATUS_SUBSCRIPTION_ID}.pdf" || true
        docker compose exec -T report-worker rm -f "/tmp/status-${STATUS_SUBSCRIPTION_ID}.pdf" || true
        docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -A -X -c \
          "SELECT id, generated_at, trigger_reason, posture_score, findings_open, pdf_minio_key, pdf_size_bytes
             FROM subscription_status_reports
            WHERE subscription_id = '${STATUS_SUBSCRIPTION_ID}' ORDER BY generated_at DESC LIMIT 3"
        ls -l ${CI_PROJECT_DIR}/status-report/
      else
        echo "STATUS_MODE unbekannt: ${MODE} (diag | erzeugen)"; exit 1
      fi

# Rollback: Compose-Snapshot + .env.bak zurueckspielen + Container hochfahren.
rollback:
  extends: .ops-base
  script:
    - cd ${DEPLOY_PATH}
    - cp docker-compose.yml.bak docker-compose.yml
    - cp .env.bak .env
    # Dieselbe Regel wie im Deploy: nur Abbilder aus der eigenen Registry ziehen.
    - echo "${GHCR_TOKEN}" | docker login ghcr.io -u dc-77 --password-stdin
    - COMPOSE_PROFILES=crm bash ${CI_PROJECT_DIR}/scripts/ops/pull-own-images.sh
    - docker compose up -d --remove-orphans
    - sleep 30
    - docker compose ps
  environment:
    name: production
    url: https://scan.vectigal.tech

# =============================================================================
# CLEANUP-PROD — Big-Bang Wipe (Q2/2026 Determinismus-Reset)
# =============================================================================
# =============================================================================
# EOL-DATA-SYNC: holt aktuelle EOL-Termine von endoflife.date und
# regeneriert report-worker/reporter/eol_data_generated.py. Push erfolgt
# durch den Job selbst (commit + push als Pipeline-Bot).
#
# Auslöser:
#   - Manuell via GitLab-UI ("Run pipeline" + Job ausführen)
#   - Schedule (CI_PIPELINE_SOURCE=schedule, weekly empfohlen):
#     GitLab → CI/CD → Schedules → "EOL-Data-Sync (weekly)" anlegen,
#     Cron z.B. "0 4 * * 1" (Mo 04:00 UTC).
#
# Sicherheitsnetz:
#   - Wenn endoflife.date down ist (entries=0): exit 1, kein Push.
#   - Bei keinen Aenderungen (`git diff --quiet`): kein Commit, kein Push.
#
# Lizenz-Hinweis: Daten von endoflife.date — CC-BY-4.0 — Attribution
# bereits im Generated-Header verzeichnet.
# =============================================================================

# YAML-Anchor: gemeinsame Defaults fuer alle Sync-Jobs (EOL-Data, kuenftig
# auch Threat-Intel/CWE-Cache). Schedule-Trigger via `SYNC_ENABLED=true`,
# manueller Trigger ueber GitLab-UI ("Run pipeline").
.sync-job-template: &sync-job-template
  stage: ops
  tags: [vectigal]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_ENABLED == "true"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true

eol-data-sync:
  <<: *sync-job-template
  # Override fuer Backwards-Compat: alte Schedules nutzen `EOL_SYNC=true`,
  # neue koennen `SYNC_ENABLED=true` verwenden. Beide funktionieren.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($EOL_SYNC == "true" || $SYNC_ENABLED == "true")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - python3 scripts/sync-eol-data.py
    - python3 scripts/_sync_commit.py report-worker/reporter/eol_data_generated.py

# F-PRE-003: Cloud-Provider-IPv4-Ranges-Sync (AWS/GCP/Cloudflare/Fastly/
# DigitalOcean + RIPEstat-ASNs fuer OVH/IONOS/STRATO/Hetzner-Online).
# Schedule-Variable `CLOUD_RANGES_SYNC=true` (oder global `SYNC_ENABLED=true`).
cloud-ranges-sync:
  <<: *sync-job-template
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($CLOUD_RANGES_SYNC == "true" || $SYNC_ENABLED == "true")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - python3 scripts/sync-cloud-ranges.py
    - python3 scripts/_sync_commit.py scan-worker/data/cloud_ranges_generated.py

# F-P0B-006: Subdomain-Takeover-Liste-Sync via EdOverflow can-i-take-over-xyz
# (~35 vulnerable Services, Stand 2026-05). Schreibt
# scan-worker/data/takeover_data_generated.py — kombiniert mit Manual-Liste
# in `phase0._build_takeover_indicators()`.
# Schedule-Variable `TAKEOVER_SYNC=true` (oder global `SYNC_ENABLED=true`).
takeover-list-sync:
  <<: *sync-job-template
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($TAKEOVER_SYNC == "true" || $SYNC_ENABLED == "true")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - python3 scripts/sync-takeover-list.py
    - python3 scripts/_sync_commit.py scan-worker/data/takeover_data_generated.py

# F-RPT-001: KNOWN_VULN_BUILDS-Sync via OSV-API + CISA-KEV (CVSS>=9.0 ODER
# KEV-listed). Schreibt report-worker/reporter/known_vuln_builds_generated.py
# — kombiniert mit Manual-Liste in `eol_detector.KNOWN_VULN_BUILDS_MANUAL`.
# Schedule-Variable `KNOWN_VULN_SYNC=true` (oder global `SYNC_ENABLED=true`).
known-vuln-builds-sync:
  <<: *sync-job-template
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($KNOWN_VULN_SYNC == "true" || $SYNC_ENABLED == "true")
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - python3 scripts/sync-known-vuln-builds.py
    - python3 scripts/_sync_commit.py report-worker/reporter/known_vuln_builds_generated.py

# Triggert scripts/cleanup-prod.sh auf vectigal-docker02. Wipet alle Scan-
# Daten, Reports, Subscriptions, MinIO-Objekte, Threat-Intel/AI-Caches.
# Erhalten bleiben users, customers, verified_domains, Schema.
#
# Nutzung:
#   1. Auf einer main-Pipeline in der GitLab-UI den `cleanup-prod`-Job
#      ausloesen UND die Job-Variable CLEANUP_CONFIRM=vectiscan-prod setzen
#      (Variable im "Run job"-Dialog eintragen).
#   2. Optional: CLEANUP_NO_BACKUP=true ueberspringt das pg_dump-Backup.
#   3. Ohne CLEANUP_CONFIRM bricht der Job sofort mit Hinweis ab — Schutz
#      vor versehentlichem Klick.
#
# Spec: docs/deterministic/01-cleanup.md, 99-CUTOVER.md
# =============================================================================

cleanup-prod:
  extends: .ops-base
  variables:
    # Override per Pipeline-Run via CI/CD-Variables.
    CLEANUP_CONFIRM: ""
    CLEANUP_NO_BACKUP: "false"
  script:
    - |
      if [ "$CLEANUP_CONFIRM" != "vectiscan-prod" ]; then
        echo "ERROR: Set CLEANUP_CONFIRM=vectiscan-prod in the pipeline-run form to confirm."
        echo "       (Job wurde versehentlich getriggert oder Bestaetigung fehlt.)"
        exit 1
      fi
    - cd ${DEPLOY_PATH}
    - cp -f ${CI_PROJECT_DIR}/scripts/cleanup-prod.sh ./cleanup-prod.sh
    - chmod +x ./cleanup-prod.sh
    - |
      # Bestaetigung an das Skript durchpipen + optional --no-backup
      ARGS="--confirm"
      if [ "$CLEANUP_NO_BACKUP" = "true" ]; then ARGS="$ARGS --no-backup"; fi
      CONFIRMATION_STRING=vectiscan-prod \
      PROJECT_ROOT=${DEPLOY_PATH} \
        bash -c "echo vectiscan-prod | ./cleanup-prod.sh $ARGS"
  environment:
    name: production
    url: https://scan.vectigal.tech

# =============================================================================
# VEC-439 C3 / VEC-442 C6 — SSO-Middleware-Konfig in den Traefik-File-Provider.
#
# Schreibt traefik/dynamic/vectiscan-auth.yml (oauth2-proxy forwardAuth) in den
# host-eigenen File-Provider (/opt/traefik/config, watch:true). Kein Credential-
# Platzhalter mehr — Basic-Auth (internal-auth) wurde in VEC-442 C6 entfernt.
# Manuell/API-getriggert, KEIN Image-Build/-Pull (needs:[]). Idempotent.
# =============================================================================
ops-traefik-auth:
  extends: .ops-base
  needs: []
  variables:
    TRAEFIK_CFG: /opt/traefik/config
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    # Traefik-Container ermitteln. Der File-Provider liest /etc/traefik/config
    # (= Host /opt/traefik/config, READ-ONLY im Traefik-Container). Schreiben
    # erfolgt ueber einen kurzlebigen Helfer-Container mit RW-Bind-Mount.
    - |
      TRAEFIK=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
      if [ -z "$TRAEFIK" ]; then echo "FATAL: kein Traefik-Container gefunden."; exit 1; fi
      echo "Traefik-Container: $TRAEFIK"
    - TRAEFIK=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
    - HELPER=busybox:1.36
    - docker image inspect "$HELPER" >/dev/null 2>&1 || docker pull "$HELPER"
    # 1) SSO-Middleware-Konfig in den Host-File-Provider schreiben (kein Platzhalter).
    - |
      docker run --rm --user 0:0 \
        -v "${CI_PROJECT_DIR}/traefik/dynamic/vectiscan-auth.yml:/src/vectiscan-auth.yml:ro" \
        -v "${TRAEFIK_CFG}:/cfg" "$HELPER" \
        sh -c 'cp /src/vectiscan-auth.yml /cfg/vectiscan-auth.yml && chmod 644 /cfg/vectiscan-auth.yml'
    - echo "=== vectiscan-auth.yml geschrieben ==="; docker run --rm -v "${TRAEFIK_CFG}:/cfg:ro" "$HELPER" ls -la /cfg/vectiscan-auth.yml || true
    # 2) Traefik (watch:true) laedt hot — warten und Middleware-Existenz pruefen.
    - sleep 6
    - |
      NET=$(docker inspect "$TRAEFIK" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
      echo "Traefik=${TRAEFIK} Net=${NET}"
      echo "--- middleware oauth2-proxy-auth@file ---"
      docker run --rm --network "$NET" curlimages/curl:8.8.0 -s --max-time 8 "http://${TRAEFIK}:8080/api/http/middlewares/oauth2-proxy-auth@file" || echo "(middleware-check fehlgeschlagen)"
    # 3) Aktive-Scan-Guard (analog .deploy-base), dann Container neu starten.
    - cd ${DEPLOY_PATH}
    - |
      if [ "${DEPLOY_FORCE:-false}" != "true" ]; then
        ACTIVE=$(docker compose exec -T postgres psql -U "${DB_USER:-vectiscan}" -d "${DB_NAME:-vectiscan}" -tAc "SELECT count(*) FROM orders WHERE status IN ('queued','scanning','passive_intel','dns_recon','scan_phase1','scan_phase2','scan_phase3','report_generating')" 2>/dev/null | tr -d '[:space:]' || echo "?")
        if [ "$ACTIVE" != "?" ] && [ "${ACTIVE:-0}" -gt 0 ]; then
          echo "ERROR: $ACTIVE aktive Scan(s) — abgebrochen. DEPLOY_FORCE=true zum Erzwingen."; exit 1
        fi
        echo "Aktive Scans: ${ACTIVE:-0} — ok."
      fi
    - cp docker-compose.yml docker-compose.yml.bak 2>/dev/null || true
    - cp ${CI_PROJECT_DIR}/docker-compose.yml .
    - TAG=${TAG:-latest} docker compose up -d --no-deps --no-build frontend api uptime-kuma grafana
    - sleep 10
    - docker compose ps frontend api uptime-kuma grafana
    # 4) Verifikation: Router-Middleware-Zustand pruefen.
    - |
      TRAEFIK=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
      NET=$(docker inspect "$TRAEFIK" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
      for R in vectiscan-web-admin vectiscan-status vectiscan-logs; do
        echo "--- router ${R}@docker ---"
        docker run --rm --network "$NET" curlimages/curl:8.8.0 -s --max-time 8 "http://${TRAEFIK}:8080/api/http/routers/${R}@docker" | head -c 500; echo
      done
    # 5) SSO-Smoke: Admin+Status liefern Redirect (302) an Keycloak, nicht mehr 401.
    #    Grafana (logs) zeigt eigene Login-Seite (200). Public unveraendert (200).
    - |
      echo "=== SSO-Smoke (VEC-442 C6) ==="
      SMOKE_FAIL=0
      check_code() { # $1=url  $2=erwartet
        CODE=$(docker run --rm curlimages/curl:8.8.0 -s -o /dev/null -w '%{http_code}' --max-time 12 "$1" 2>/dev/null || echo "ERR")
        if [ "$CODE" = "$2" ]; then echo "PASS  $1 -> $CODE"; else echo "FAIL  $1 -> $CODE (erwartet $2)"; SMOKE_FAIL=1; fi
      }
      # SSO-Surfaces: oauth2-proxy -> Keycloak-Redirect (302), Grafana -> eigene Login (200/302)
      check_code "https://scan.vectigal.tech/admin"   302
      check_code "https://status.vectigal.tech/"      302
      check_code "https://logs.vectigal.tech/"        200
      # API admin: App-JWT (401 JSON), kein Traefik-Gate
      check_code "https://scan-api.vectigal.tech/api/admin/review/queue" 401
      # Oeffentlich: unveraendert
      check_code "https://scan.vectigal.tech/"        200
      if [ "$SMOKE_FAIL" = "1" ]; then
        echo "SSO-SMOKE: FAIL — Pruefen/Revert."
      else
        echo "SSO-SMOKE: ALLE PASS."
      fi
    - echo "=== FERTIG ==="
  environment:
    name: production
    url: https://scan.vectigal.tech

# =============================================================================
# VEC-437 (C1) — Keycloak-SSO provisionieren (dedizierte Instanz, Parent VEC-421).
#
# Rendert die Realm-Import-Datei (Client-Secrets aus maskierten CI-Vars statt
# Repo-Platzhalter), legt sie nach ${DEPLOY_PATH}/keycloak/import/ und startet
# das Compose-Profil `sso` (keycloak-db + keycloak). Default-Deploys lassen das
# sso-Profil aus -> dieser Job ist der EINZIGE Aktivierungspfad. Idempotent:
# Realm-Import-Strategie IGNORE_EXISTING ueberschreibt einen bestehenden Realm nicht.
# KEIN Image-Build/-Pull-Zwang (needs:[]); manuell/API-getriggert.
#
# Benoetigte maskierte Pipeline-Variablen (Owner: Hamilton/Maintainer; Dev-Token
# kann sie NICHT setzen):
#   KC_DB_PASSWORD                 Postgres-Passwort der Keycloak-DB
#   KC_BOOTSTRAP_ADMIN_PASSWORD    Master-Admin-Passwort (Erststart)
#   KEYCLOAK_GRAFANA_SECRET        Client-Secret vectiscan-grafana
#   KEYCLOAK_OAUTH2_PROXY_SECRET   Client-Secret vectiscan-oauth2-proxy
#   KC_BOOTSTRAP_ADMIN_USERNAME    (optional, Default `admin`)
# Details + Verifikation: docs/AUTH-SSO-C1-KEYCLOAK.md
# =============================================================================
ops-keycloak-healthcheck:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - cd ${DEPLOY_PATH}
    - docker compose ps keycloak-db keycloak
    - echo "=== Keycloak Logs (last 50 lines) ==="
    - docker logs vectiscan-keycloak-1 --tail 50 2>&1 || echo "Container nicht gefunden"
    - echo "=== OIDC-Discovery (extern) ==="
    - |
      CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://id.vectigal.tech/realms/vectiscan/.well-known/openid-configuration" 2>/dev/null || echo ERR)
      echo "OIDC -> $CODE"

ops-keycloak-provision:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - |
      MISS=""
      for V in KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_GRAFANA_SECRET KEYCLOAK_OAUTH2_PROXY_SECRET OAUTH2_PROXY_COOKIE_SECRET; do
        eval "VAL=\${$V}"
        if [ -z "$VAL" ]; then MISS="$MISS $V"; fi
      done
      if [ -n "$MISS" ]; then
        echo "FATAL: maskierte Pipeline-Variable(n) fehlen:$MISS"
        echo "       Maintainer muss sie als masked CI/CD-Variablen setzen (s. docs/AUTH-SSO-C1-KEYCLOAK.md / docs/AUTH-SSO-C3-OAUTH2-PROXY.md)."
        echo "       OAUTH2_PROXY_COOKIE_SECRET erzeugen: openssl rand -base64 32 | tr -- '+/' '-_'"
        exit 1
      fi
      echo "OK: alle 5 SSO-Secrets praesent (Werte werden nie geloggt)."
    - cd ${DEPLOY_PATH}
    # 1) Aktuelles Compose ausrollen (enthaelt die keycloak/keycloak-db-Services).
    - cp docker-compose.yml docker-compose.yml.bak 2>/dev/null || true
    - cp ${CI_PROJECT_DIR}/docker-compose.yml .
    # 2) Realm-Import rendern: Platzhalter -> echte Secrets. python3 statt sed
    #    (robust gegen Sonderzeichen in Secrets). Ziel chmod 600 (enthaelt Secrets).
    - mkdir -p ${DEPLOY_PATH}/keycloak/import
    # python3 -c (kein Heredoc -> kein YAML-Indent-Footgun). Secrets via Env,
    # nie als Argv (taucht sonst in ps/Logs auf). Assert bricht ab, falls ein
    # Platzhalter uebrig bleibt (z.B. Tippfehler im Var-Namen).
    - |
      SRC=${CI_PROJECT_DIR}/keycloak/import/vectiscan-realm.json \
      DST=${DEPLOY_PATH}/keycloak/import/vectiscan-realm.json \
      python3 -c 'import os; d=open(os.environ["SRC"]).read(); d=d.replace("__KEYCLOAK_GRAFANA_SECRET__",os.environ["KEYCLOAK_GRAFANA_SECRET"]).replace("__KEYCLOAK_OAUTH2_PROXY_SECRET__",os.environ["KEYCLOAK_OAUTH2_PROXY_SECRET"]); assert "__KEYCLOAK_" not in d, "Platzhalter nicht ersetzt"; open(os.environ["DST"],"w").write(d); print("Realm-Import gerendert ->", os.environ["DST"])'
    # chmod 644 (nicht 600): kcadm.sh laeuft als UID 1000 im Container; 600+root
    # = AccessDeniedException (Java "File not found"). 644 ist hier korrekt:
    # docker02 ist internes DMZ-System, der Bind-Mount ist :ro im Container.
    # Cleanup nach Import (Schritt 5) entfernt die Datei mit den Client-Secrets.
    - chmod 644 ${DEPLOY_PATH}/keycloak/import/vectiscan-realm.json
    - echo "=== Import-Datei (kein Secret-Echo) ==="; ls -la ${DEPLOY_PATH}/keycloak/import/
    # 3) sso-Profil starten (zusaetzlich zu crm). --import-realm entfernt (Keycloak 26
    #    schema-strict: Realm-Import via kcadm.sh nach dem Start, nicht beim Start).
    - COMPOSE_PROFILES=crm,sso TAG=${TAG:-latest} docker compose up -d --no-build keycloak-db keycloak
    # 4) Auf Keycloak-Start warten (bis 3 Min, /health/ready). Keycloak 26 braucht
    #    60-120s fuer Quarkus-Augmentation (--optimized=false) + JGroups-Timeout.
    - |
      echo "=== Warte auf Keycloak /health/ready (bis 3 Min) ==="
      for i in $(seq 1 18); do
        STATUS=$(docker exec vectiscan-keycloak-1 curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready 2>/dev/null || echo ERR)
        echo "Attempt $i: $STATUS"
        if [ "$STATUS" = "200" ]; then echo "Keycloak UP!"; break; fi
        sleep 10
      done
    - docker compose ps keycloak-db keycloak
    # 5) Realm via kcadm.sh importieren (gibt im Fehlerfall den echten Grund aus).
    #    Passwort via Env-Var, nie als Argument (Secrets-Hygiene).
    - |
      echo "=== Realm-Import via kcadm ==="
      docker exec -e KCADM_PW="${KC_BOOTSTRAP_ADMIN_PASSWORD}" vectiscan-keycloak-1 bash -c '
        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://localhost:8080 \
          --realm master \
          --user admin \
          --password "$KCADM_PW" 2>&1 && \
        /opt/keycloak/bin/kcadm.sh get realms/vectiscan 2>/dev/null | grep -q vectiscan \
          && echo "Realm vectiscan existiert bereits (IGNORE_EXISTING)" \
          || /opt/keycloak/bin/kcadm.sh create realms \
               -f /opt/keycloak/data/import/vectiscan-realm.json 2>&1 \
          && echo "Realm-Import OK" || echo "Realm-Import FEHLER"
      '
    # Cleanup: gerenderte Realm-JSON (enthaelt Client-Secrets) nach Import entfernen.
    # Der :ro Bind-Mount verhindert Loeschen von innen; daher rm auf dem Host.
    - rm -f ${DEPLOY_PATH}/keycloak/import/vectiscan-realm.json && echo "Realm-Import-Datei bereinigt."
    # 6) Verifikation: OIDC-Discovery vom Host
    - 'echo "=== OIDC-Discovery extern (Browser-Pfad) ==="'
    - |
      DISC="https://id.vectigal.tech/realms/vectiscan/.well-known/openid-configuration"
      CODE=$(docker run --rm curlimages/curl:8.8.0 -s -o /dev/null -w '%{http_code}' --max-time 20 "$DISC" 2>/dev/null || echo ERR)
      echo "GET $DISC -> $CODE (erwartet: 200)"
    # 7) VEC-439 C3: oauth2-proxy starten (Forward-Auth-Bruecke fuer status + /admin).
    #    Braucht den importierten Realm (OIDC-Discovery oben 200). KEYCLOAK_OAUTH2_PROXY_SECRET
    #    + OAUTH2_PROXY_COOKIE_SECRET kommen als maskierte CI-Vars aus der Job-Shell-Env und
    #    werden von `docker compose` direkt interpoliert (wie KC_DB_PASSWORD beim keycloak-Step,
    #    oben) — kein Schreiben ins Host-.env noetig (Secret-Hygiene).
    - 'echo "=== VEC-439 C3: oauth2-proxy starten ==="'
    - COMPOSE_PROFILES=crm,sso TAG=${TAG:-latest} docker compose up -d --no-build oauth2-proxy
    - |
      echo "=== Warte auf oauth2-proxy /ping (bis 90s) ==="
      # oauth2-proxy = Distroless (kein wget/sh -> kein docker exec). Pruefung via
      # curl-Helper im externen proxy-net gegen den Service-Alias `oauth2-proxy`.
      # /ping ist key-frei + unauthentifiziert; 200 = Prozess up + OIDC-Discovery geladen.
      OK=NO
      for i in $(seq 1 9); do
        STATUS=$(docker run --rm --network proxy-net curlimages/curl:8.8.0 -s -o /dev/null \
          -w '%{http_code}' --max-time 8 http://oauth2-proxy:4180/ping 2>/dev/null || echo ERR)
        echo "Attempt $i: ping=$STATUS"
        if [ "$STATUS" = "200" ]; then OK=YES; echo "oauth2-proxy UP!"; break; fi
        sleep 10
      done
      docker compose ps oauth2-proxy
      if [ "$OK" != "YES" ]; then
        echo "WARN: oauth2-proxy /ping nicht 200 — Logs:"; docker logs --tail 40 vectiscan-oauth2-proxy-1 2>&1 || true
      fi
    - echo "=== FERTIG C1+C3 — Live-QA/Security siehe VEC-441 (C5) ==="
  environment:
    name: production
    url: https://id.vectigal.tech

# =============================================================================
# VEC-470 — Keycloak: einen User idempotent in die Gruppe `vectiscan-admin`
# aufnehmen. Ohne diese Mitgliedschaft liefert oauth2-proxy (--allowed-group=
# vectiscan-admin) nach erfolgreichem Keycloak-Login ein *403* auf /admin — die
# Traefik-errors-Middleware faengt aber nur 401 ab, also sieht der User einen
# rohen 403 ("Admin-Freigabebereich oeffnet nicht"). Der Realm-Import legt KEINE
# User an und `defaultGroups` ist leer, daher muss jeder Admin explizit zugewiesen
# werden. Dieser Job macht das reproduzierbar + idempotent statt Klick im Admin-UI.
#
# Voraussetzung:
#   KC_BOOTSTRAP_ADMIN_PASSWORD  (maskierte CI-Var, wie ops-keycloak-provision)
#   KC_ADMIN_EMAIL               E-Mail des Ziel-Users (als Pipeline-Variable beim
#                                manuellen Run setzen). Der User muss im Realm
#                                bereits existieren (min. 1x eingeloggt / vom Admin
#                                angelegt) — dieser Job legt KEINE Accounts an.
# Reversibel (Two-way-Door): Entzug = kcadm delete users/<id>/groups/<gid>.
# =============================================================================
ops-keycloak-grant-admin:
  extends: .ops-base
  needs: []
  script:
    - |
      if [ -z "${KC_BOOTSTRAP_ADMIN_PASSWORD}" ]; then
        echo "FATAL: KC_BOOTSTRAP_ADMIN_PASSWORD fehlt (maskierte CI-Var)."; exit 1
      fi
      if [ -z "${KC_ADMIN_EMAIL}" ]; then
        echo "FATAL: KC_ADMIN_EMAIL fehlt. Beim manuellen Run als Pipeline-Variable setzen"
        echo "       (E-Mail des Users, der Admin-Zugriff bekommen soll)."; exit 1
      fi
      echo "Ziel-User: ${KC_ADMIN_EMAIL} -> Gruppe vectiscan-admin (Realm vectiscan)"
    - |
      docker exec -e KCADM_PW="${KC_BOOTSTRAP_ADMIN_PASSWORD}" -e EMAIL="${KC_ADMIN_EMAIL}" \
        vectiscan-keycloak-1 bash -c '
        set -e
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://localhost:8080 --realm master --user admin --password "$KCADM_PW" >/dev/null
        USERID=$($K get users -r vectiscan -q email="$EMAIL" --fields id --format csv --noquotes 2>/dev/null | head -1 | tr -d "\r")
        if [ -z "$USERID" ]; then
          echo "FATAL: kein User mit E-Mail $EMAIL im Realm vectiscan gefunden."
          echo "       Der Account muss zuerst existieren (User loggt sich 1x ein ODER"
          echo "       Admin legt ihn in der Keycloak-Konsole an). Dieser Job legt keine an."
          exit 2
        fi
        GID=$($K get groups -r vectiscan --fields id,name --format csv --noquotes 2>/dev/null | grep "vectiscan-admin" | head -1 | cut -d, -f1)
        if [ -z "$GID" ]; then
          echo "FATAL: Gruppe vectiscan-admin nicht gefunden — Realm nicht provisioniert (ops-keycloak-provision)."
          exit 3
        fi
        echo "User-ID=$USERID Group-ID=$GID — fuege hinzu (idempotent)..."
        $K update "users/$USERID/groups/$GID" -r vectiscan -s realm=vectiscan -s userId="$USERID" -s groupId="$GID" -n
        echo "=== Verifikation: Gruppen des Users ==="
        MEMBER=$($K get "users/$USERID/groups" -r vectiscan --fields name --format csv --noquotes 2>/dev/null | tr -d "\r")
        echo "$MEMBER"
        echo "$MEMBER" | grep -q "vectiscan-admin" \
          && echo "OK: $EMAIL ist jetzt in vectiscan-admin — /admin-Edge-Gate (403) entblockt." \
          || { echo "FEHLER: Mitgliedschaft nach update nicht bestaetigt."; exit 4; }
      '
  environment:
    name: production
    url: https://id.vectigal.tech

# =============================================================================
# VEC-473 — Diagnose: Realm-User im Realm `vectiscan` auflisten. Reiner Read-
# only-Ops-Job, um vor `ops-keycloak-grant-admin` die tatsaechliche E-Mail/
# Username eines Accounts zu ermitteln (Grant matcht exakt per email). Optional
# KC_USER_SEARCH als Pipeline-Variable (kcadm `-q search=`), sonst alle User.
#   KC_BOOTSTRAP_ADMIN_PASSWORD  (maskierte CI-Var, wie ops-keycloak-provision)
# =============================================================================
ops-keycloak-list-users:
  extends: .ops-base
  needs: []
  script:
    - |
      if [ -z "${KC_BOOTSTRAP_ADMIN_PASSWORD}" ]; then
        echo "FATAL: KC_BOOTSTRAP_ADMIN_PASSWORD fehlt (maskierte CI-Var)."; exit 1
      fi
      echo "Realm vectiscan — User-Liste (Suchbegriff: '${KC_USER_SEARCH:-<alle>}')"
    - |
      docker exec -e KCADM_PW="${KC_BOOTSTRAP_ADMIN_PASSWORD}" -e SEARCH="${KC_USER_SEARCH:-}" \
        vectiscan-keycloak-1 bash -c '
        set -e
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://localhost:8080 --realm master --user admin --password "$KCADM_PW" >/dev/null
        if [ -n "$SEARCH" ]; then
          $K get users -r vectiscan -q search="$SEARCH" --fields id,username,email,enabled,emailVerified --format csv --noquotes 2>/dev/null
        else
          $K get users -r vectiscan --fields id,username,email,enabled,emailVerified --format csv --noquotes 2>/dev/null
        fi
        echo "=== Ende User-Liste ==="
      '
  environment:
    name: production
    url: https://id.vectigal.tech

# =============================================================================
# VEC-473/VEC-470 — First-Admin-Bootstrap: Keycloak-User im Realm `vectiscan`
# ANLEGEN (falls nicht vorhanden), temporaeres Passwort setzen und idempotent
# in Gruppe `vectiscan-admin` aufnehmen. Grund: Realm-Import seedet KEINE User,
# `ops-keycloak-grant-admin` fand den Ziel-User daher nicht (Realm leer). Dieser
# Job schliesst die Luecke fuer den ersten Admin. Two-way-Door (User loeschbar).
#   KC_BOOTSTRAP_ADMIN_PASSWORD  (maskierte CI-Var, wie ops-keycloak-provision)
#   KC_ADMIN_EMAIL               E-Mail/Username des Ziel-Admins (Pipeline-Var)
# Das temporaere Passwort wird IM Job zufaellig erzeugt, 1x geloggt und MUSS beim
# ersten Login geaendert werden (temporary=true).
# =============================================================================
ops-keycloak-create-admin:
  extends: .ops-base
  needs: []
  script:
    - |
      if [ -z "${KC_BOOTSTRAP_ADMIN_PASSWORD}" ]; then
        echo "FATAL: KC_BOOTSTRAP_ADMIN_PASSWORD fehlt (maskierte CI-Var)."; exit 1
      fi
      if [ -z "${KC_ADMIN_EMAIL}" ]; then
        echo "FATAL: KC_ADMIN_EMAIL fehlt (Pipeline-Variable)."; exit 1
      fi
      echo "First-Admin-Bootstrap: ${KC_ADMIN_EMAIL} -> Realm vectiscan / Gruppe vectiscan-admin"
    - |
      docker exec -e KCADM_PW="${KC_BOOTSTRAP_ADMIN_PASSWORD}" -e EMAIL="${KC_ADMIN_EMAIL}" \
        vectiscan-keycloak-1 bash -c '
        set -e
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://localhost:8080 --realm master --user admin --password "$KCADM_PW" >/dev/null
        USERID=$($K get users -r vectiscan -q email="$EMAIL" --fields id --format csv --noquotes 2>/dev/null | head -1 | tr -d "\r")
        if [ -z "$USERID" ]; then
          echo "User existiert nicht — lege an..."
          $K create users -r vectiscan -s username="$EMAIL" -s email="$EMAIL" -s enabled=true -s emailVerified=true >/dev/null
          USERID=$($K get users -r vectiscan -q email="$EMAIL" --fields id --format csv --noquotes 2>/dev/null | head -1 | tr -d "\r")
          echo "Angelegt: User-ID=$USERID"
        else
          echo "User existiert bereits: User-ID=$USERID (kein Re-Create)"
        fi
        [ -z "$USERID" ] && { echo "FATAL: User-Anlage fehlgeschlagen."; exit 2; }
        TMPPW="Vs-$(tr -dc A-Za-z0-9 </dev/urandom | head -c 14)!"
        $K set-password -r vectiscan --username "$EMAIL" --new-password "$TMPPW" --temporary
        GID=$($K get groups -r vectiscan --fields id,name --format csv --noquotes 2>/dev/null | grep "vectiscan-admin" | head -1 | cut -d, -f1)
        [ -z "$GID" ] && { echo "FATAL: Gruppe vectiscan-admin nicht gefunden (Realm nicht provisioniert)."; exit 3; }
        $K update "users/$USERID/groups/$GID" -r vectiscan -s realm=vectiscan -s userId="$USERID" -s groupId="$GID" -n
        MEMBER=$($K get "users/$USERID/groups" -r vectiscan --fields name --format csv --noquotes 2>/dev/null | tr -d "\r")
        echo "=== Verifikation Gruppen: $MEMBER ==="
        echo "$MEMBER" | grep -q "vectiscan-admin" || { echo "FATAL: Mitgliedschaft nicht bestaetigt."; exit 4; }
        echo "############################################################"
        echo "# LOGIN: $EMAIL"
        echo "# TEMP-PASSWORT (einmalig, beim 1. Login aendern): $TMPPW"
        echo "############################################################"
        echo "OK: $EMAIL angelegt + in vectiscan-admin — /admin-Edge-Gate (403) entblockt."
      '
  environment:
    name: production
    url: https://id.vectigal.tech

# =============================================================================
# VEC-470/VEC-473 — Keycloak: fehlenden Client-Scope `groups` anlegen + dem
# Client `vectiscan-oauth2-proxy` als Default-Scope zuweisen. Ursache des
# Login-Fehlers: oauth2-proxy fordert `scope=openid profile email groups`, der
# Realm kennt aber keinen Scope `groups` -> Keycloak antwortet `invalid_scope`
# -> Redirect auf /oauth2/callback?error=invalid_scope -> 403 (kein Login moeglich,
# daher war der Realm auch leer). Idempotent, Read-check vor Create. Two-way-Door.
#   KC_BOOTSTRAP_ADMIN_PASSWORD  (maskierte CI-Var)
# =============================================================================
ops-keycloak-fix-groups-scope:
  extends: .ops-base
  needs: []
  script:
    - |
      if [ -z "${KC_BOOTSTRAP_ADMIN_PASSWORD}" ]; then
        echo "FATAL: KC_BOOTSTRAP_ADMIN_PASSWORD fehlt (maskierte CI-Var)."; exit 1
      fi
    - |
      docker exec -e KCADM_PW="${KC_BOOTSTRAP_ADMIN_PASSWORD}" \
        vectiscan-keycloak-1 bash -c '
        set -e
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://localhost:8080 --realm master --user admin --password "$KCADM_PW" >/dev/null
        CLIENT=vectiscan-oauth2-proxy
        # kein awk im Container -> grep/cut. Zeilenformat: <id>,<name>
        scope_id() { $K get client-scopes -r vectiscan --fields id,name --format csv --noquotes 2>/dev/null | tr -d "\r" | grep ",groups$" | head -1 | cut -d, -f1; }
        SID=$(scope_id || true)
        if [ -z "$SID" ]; then
          echo "Client-Scope groups fehlt — lege an..."
          $K create client-scopes -r vectiscan \
            -s name=groups -s protocol=openid-connect \
            -s "attributes.\"include.in.token.scope\"=true" \
            -s "attributes.\"display.on.consent.screen\"=false" >/dev/null
          SID=$(scope_id || true)
          echo "Angelegt: scope-id=$SID"
        else
          echo "Client-Scope groups existiert bereits: scope-id=$SID"
        fi
        [ -z "$SID" ] && { echo "FATAL: scope-id nicht ermittelbar."; exit 2; }
        # Mapper idempotent sicherstellen
        HASMAP=$($K get "client-scopes/$SID/protocol-mappers/models" -r vectiscan --fields name --format csv --noquotes 2>/dev/null | tr -d "\r" | grep -c "^groups$" || true)
        if [ "$HASMAP" = "0" ]; then
          echo "Group-Membership-Mapper fehlt — lege an..."
          $K create "client-scopes/$SID/protocol-mappers/models" -r vectiscan \
            -s name=groups -s protocol=openid-connect -s protocolMapper=oidc-group-membership-mapper \
            -s "config.\"claim.name\"=groups" -s "config.\"full.path\"=false" \
            -s "config.\"id.token.claim\"=true" -s "config.\"access.token.claim\"=true" \
            -s "config.\"userinfo.token.claim\"=true" >/dev/null
        else
          echo "Mapper groups existiert bereits."
        fi
        CID=$($K get clients -r vectiscan -q clientId=$CLIENT --fields id --format csv --noquotes 2>/dev/null | tr -d "\r" | head -1)
        [ -z "$CID" ] && { echo "FATAL: Client $CLIENT nicht gefunden."; exit 3; }
        echo "Client $CLIENT id=$CID — weise groups als Default-Scope zu (idempotent)..."
        $K update "clients/$CID/default-client-scopes/$SID" -r vectiscan >/dev/null 2>&1 || true
        ASSIGNED=$($K get "clients/$CID/default-client-scopes" -r vectiscan --fields name --format csv --noquotes 2>/dev/null | tr -d "\r" | tr "\n" " ")
        echo "=== Default-Client-Scopes von $CLIENT: $ASSIGNED ==="
        echo "$ASSIGNED" | grep -qw groups \
          && echo "OK: groups-Scope aktiv fuer $CLIENT — invalid_scope behoben, Login moeglich." \
          || { echo "FEHLER: groups-Scope nach Zuweisung nicht bestaetigt."; exit 4; }
      '
  environment:
    name: production
    url: https://id.vectigal.tech

# =============================================================================
# VEC-378 — die beiden auftragsgebundenen Ops-Jobs (ops-admin-release-vec378,
# ops-check-order-status-vec378) sind mit S6 entfernt. Sie trugen
# `when: always` fuer `$CI_PIPELINE_SOURCE == "api"` und riefen damit auf
# jeder API-Pipeline `POST /api/admin/orders/<fester Auftrag>/release` auf der
# Produktion auf. Ein Ops-Job, der eine Kundenorder anfasst, gehoert nicht in
# eine automatisch laufende Stage.
# =============================================================================

# =============================================================================
ops-provision-turnstile:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - |
      set -e

      if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
        echo "ERROR: CF_API_TOKEN und CF_ACCOUNT_ID muessen als maskierte CI/CD-Variablen gesetzt sein."
        exit 1
      fi
      if [ -z "${GL_WRITE_TOKEN}" ]; then
        echo "ERROR: GL_WRITE_TOKEN (GitLab PAT api-Scope + Maintainer) fehlt."
        echo "       GitLab: User Settings -> Access Tokens -> api-Scope -> als CI-Var GL_WRITE_TOKEN setzen."
        exit 1
      fi

      echo "Erstelle Cloudflare Turnstile Widget fuer scan.vectigal.tech + vectigal.tech ..."
      CF_RESPONSE=$(curl -s -f -X POST \
        "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/challenges/widgets" \
        -H "Authorization: Bearer ${CF_API_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"name":"VectiScan Webcheck","domains":["scan.vectigal.tech","vectigal.tech"],"mode":"managed","offlabel":false}')

      CF_SUCCESS=$(echo "${CF_RESPONSE}" | sed -n 's/.*"success":\([a-z]*\).*/\1/p' | head -1)
      if [ "${CF_SUCCESS}" != "true" ]; then
        echo "ERROR: Cloudflare API Fehler (Secret redacted):"
        echo "${CF_RESPONSE}" | sed 's/"secret":"[^"]*"/"secret":"[REDACTED]"/g'
        exit 1
      fi

      SITE_KEY=$(echo "${CF_RESPONSE}" | sed -n 's/.*"sitekey":"\([^"]*\)".*/\1/p')
      SECRET_KEY=$(echo "${CF_RESPONSE}" | sed -n 's/.*"secret":"\([^"]*\)".*/\1/p')

      if [ -z "${SITE_KEY}" ] || [ -z "${SECRET_KEY}" ]; then
        echo "ERROR: Konnte Site-Key oder Secret-Key nicht aus CF-Antwort extrahieren."
        exit 1
      fi

      echo "Widget angelegt. Site Key: ${SITE_KEY}"
      echo "Secret Key: [MASKED]"

      GL_VARS_API="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/variables"

      _set_var() {
        local KEY="$1" MASKED="$3"
        HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${GL_VARS_API}/${KEY}" \
          -H "PRIVATE-TOKEN: ${GL_WRITE_TOKEN}" \
          --data-urlencode "value=$2" \
          -d "masked=${MASKED}&protected=false&variable_type=env_var")
        if [ "${HTTP}" = "404" ]; then
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${GL_VARS_API}" \
            -H "PRIVATE-TOKEN: ${GL_WRITE_TOKEN}" \
            --data-urlencode "key=${KEY}" \
            --data-urlencode "value=$2" \
            -d "masked=${MASKED}&protected=false&variable_type=env_var")
        fi
        echo "  ${KEY}: HTTP ${HTTP}"
        [ "${HTTP}" = "200" ] || [ "${HTTP}" = "201" ] || { echo "ERROR: Konnte ${KEY} nicht setzen."; return 1; }
      }

      echo "Setze GitLab CI-Variablen ..."
      _set_var "NEXT_PUBLIC_TURNSTILE_SITE_KEY" "${SITE_KEY}" "false"
      _set_var "WEBCHECK_TURNSTILE_SECRET" "${SECRET_KEY}" "true"

      echo "=== Provisionierung abgeschlossen ==="
      echo "  NEXT_PUBLIC_TURNSTILE_SITE_KEY = ${SITE_KEY}"
      echo "  WEBCHECK_TURNSTILE_SECRET      = [MASKED]"
      echo "  Naechster Schritt: feat/vec-189-turnstile-widget mergen + build triggern."

# =============================================================================
# VEC-328 — Traefik twenty-api@docker Router-Fix (Force-Recreate twenty-server)
# twenty-server lief ohne COMPOSE_PROFILES=crm gestartet → Labels fehlen →
# twenty-api@docker nicht in Traefik registriert → /rest/* läuft über
# twenty@docker (internal-auth@file) → 401 → crm-lookup-failed.
# Dieser einmalige Ops-Job force-recreated twenty-server + twenty-worker
# damit Traefik die Labels aufnimmt und /rest/* korrekt geroutet wird.
# Danach entfällt dieser Job (oder bleibt als idempotenter Notfall-Reset).
# =============================================================================
ops-fix-crm-traefik-vec328:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - cd ${DEPLOY_PATH}
    # --- Schritt 1: Traefik static config lesen (Docker provider + constraints) ---
    - |
      echo "=== /opt/traefik/traefik.yml ==="
      cat /opt/traefik/traefik.yml 2>/dev/null || echo "NICHT GEFUNDEN"
      echo ""
      echo "=== /opt/traefik/*.yml (alle Configs) ==="
      ls /opt/traefik/*.yml /opt/traefik/*.toml 2>/dev/null || echo "keine weiteren configs"
      echo ""
      echo "=== /opt/traefik/docker-compose.yml ==="
      cat /opt/traefik/docker-compose.yml 2>/dev/null || echo "NICHT GEFUNDEN"
    # --- Schritt 2: Traefik API via curl-Container (korrekte Methode) ---
    - |
      TRAEFIK=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
      TRAEFIK_IP=$(docker inspect "$TRAEFIK" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' | awk '{print $1}')
      echo "Traefik Container: $TRAEFIK | IP: $TRAEFIK_IP"
      echo ""
      echo "=== Alle Docker-Provider Routers (via curl auf proxy-net) ==="
      docker run --rm --network proxy-net curlimages/curl:8.8.0 -s --max-time 10 \
        "http://${TRAEFIK_IP}:8080/api/http/routers?per_page=200" 2>/dev/null \
        | tr ',' '\n' | grep '"name"' | sort | head -60
      echo ""
      echo "=== twenty@docker gezielt ==="
      docker run --rm --network proxy-net curlimages/curl:8.8.0 -s --max-time 10 \
        "http://${TRAEFIK_IP}:8080/api/http/routers/twenty@docker" 2>/dev/null | head -5
      echo ""
      echo "=== twenty-api@docker gezielt ==="
      docker run --rm --network proxy-net curlimages/curl:8.8.0 -s --max-time 10 \
        "http://${TRAEFIK_IP}:8080/api/http/routers/twenty-api@docker" 2>/dev/null | head -5
    # --- Schritt 3: socket-proxy Config (was darf Traefik sehen?) ---
    - |
      SPROXY=$(docker ps --format '{{.Names}}' | grep -i socket.proxy | head -1)
      echo "socket-proxy Container: $SPROXY"
      if [ -n "$SPROXY" ]; then
        echo "=== socket-proxy Env (Zugriffsliste) ==="
        docker inspect "$SPROXY" --format '{{range .Config.Env}}{{.}}{{"\n"}}{{end}}' | sort
      fi
    # --- Schritt 4: Force-Recreate twenty-server + twenty-worker ---
    - echo "=== Force-Recreate twenty-server + twenty-worker ==="
    - COMPOSE_PROFILES=crm docker compose up -d --force-recreate --no-build twenty-server twenty-worker
    - sleep 20
    - docker compose ps twenty-server twenty-worker
    # --- Schritt 5: Nach Recreate: Traefik Router via curl prüfen ---
    - |
      TRAEFIK=$(docker ps --format '{{.Names}}' | grep -i traefik | head -1)
      TRAEFIK_IP=$(docker inspect "$TRAEFIK" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' | awk '{print $1}')
      echo "=== twenty-api@docker NACH Recreate ==="
      RESULT=$(docker run --rm --network proxy-net curlimages/curl:8.8.0 -s --max-time 10 \
        "http://${TRAEFIK_IP}:8080/api/http/routers/twenty-api@docker" 2>/dev/null)
      echo "$RESULT"
      if echo "$RESULT" | grep -q '"name"'; then
        echo "PASS: twenty-api@docker Router registriert"
      else
        echo "FAIL: Router fehlt trotz korrekter Labels — Root-Cause in Traefik-Config (constraints/network?)"
        exit 1
      fi
    # --- Schritt 6: Smoke-Test REST direkt ---
    - |
      TWENTY_IP=$(docker inspect vectiscan-twenty-server-1 \
        --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' | awk '{print $1}')
      echo "=== REST Smoke-Test: http://${TWENTY_IP}:3000/rest/people ==="
      HTTP=$(docker run --rm curlimages/curl:8.8.0 -s -o /dev/null -w '%{http_code}' \
        --max-time 10 "http://${TWENTY_IP}:3000/rest/people?limit=1" 2>/dev/null)
      echo "HTTP Status: ${HTTP}"
    - echo "=== VEC-328 Diagnose abgeschlossen ==="

# =============================================================================
# ops-verify-crm-vec328: Post-Deploy-Verifikation — CRM_WEBHOOK_URL=intern +
# Direktzugriff vectiscan-api-1 → vectiscan-twenty-server-1 via proxy-net.
# Prüft: (1) CRM_WEBHOOK_URL im laufenden api-Container auf interne URL,
# (2) HTTP-Erreichbarkeit /rest/people ohne Traefik, (3) letzte CRM-Log-Zeilen.
# Bestanden wenn: URL=intern + HTTP != 000 + kein "crm-lookup-failed" in Logs.
# =============================================================================
ops-verify-crm-vec328:
  extends: .ops-base
  needs: []
  script:
    - cd ${DEPLOY_PATH}
    - docker compose exec -T api sh -c 'echo CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL}' || echo api-nicht-erreichbar
    - |
      echo "=== CRM_API_KEY Laenge (kein Wert) ==="
      docker compose exec -T api sh -c 'klen=${#CRM_API_KEY}; echo "CRM_API_KEY length=${klen:-0}"' || echo api-nicht-erreichbar
      echo "=== HTTP-Status Twenty REST /rest/people (direkt aus api-Container) ==="
      docker compose exec -T api sh -c '
        HTTP_CODE=$(curl -s -o /tmp/crm_resp.json -w "%{http_code}" \
          -H "Authorization: Bearer $CRM_API_KEY" \
          http://vectiscan-twenty-server-1:3000/rest/people)
        echo "HTTP_STATUS:${HTTP_CODE}"
        head -c 300 /tmp/crm_resp.json
      ' || echo api-nicht-erreichbar
      echo "=== crm.ts WARN logs (HTTP-Status bei lookup failed) ==="
      docker logs --tail 3000 vectiscan-api-1 2>&1 | grep -E "CRM upsert: lookup failed|crm-lookup-failed" | tail -10 || echo PASS-kein-crm-lookup-failed

# =============================================================================
# ops-e2e-vec387: Post-Deploy-Runtime-Beleg CRM-Upsert via interner URL (VEC-387).
# Führt einen vollen DOI-Confirm durch und prüft ob api-Container crm=created/
# crm=exists loggt (statt crm-lookup-failed). Bestanden wenn: API-Log zeigt
# crm=created oder crm=exists nach dem Confirm-Aufruf.
# Grep erfasst jetzt auch den Demo-Lead-Pfad ("demo lead CRM") — VEC-407.
# needs: [] → läuft unabhängig, kein Re-Deploy erforderlich.
# =============================================================================
ops-e2e-vec387:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  script:
    - cd ${DEPLOY_PATH}
    - |
      echo "=== VEC-387 Post-Deploy E2E: CRM crm=created Beleg ==="
      echo "Stack laeuft mit CRM_WEBHOOK_URL=intern (ca47dcf / Pipeline 2745)"
      docker compose exec -T postgres psql -U "${DB_USER}" -d "${DB_NAME}" \
        -c "DELETE FROM webcheck_leads WHERE email LIKE 'e2e-vec387%';" 2>&1 || true
      docker compose exec -T postgres psql -U "${DB_USER}" -d "${DB_NAME}" \
        -c "INSERT INTO webcheck_leads (email, domain, verification_token, doi_token, doi_sent_at, ip, marketing_consent, consent_text_version, consent_status, legal_basis)
            VALUES ('e2e-vec387@vectigal.tech', 'vectigal.tech', 'e2e-vec387-token', gen_random_uuid()::text, NOW(), '127.0.0.1', TRUE, 'v1-e2e', 'pending', 'consent');"
      DOI_TOKEN=$(docker compose exec -T postgres psql -U "${DB_USER}" -d "${DB_NAME}" -tAc \
        "SELECT doi_token FROM webcheck_leads WHERE email='e2e-vec387@vectigal.tech' AND consent_status='pending' ORDER BY created_at DESC LIMIT 1;" | tr -d '[:space:]')
      echo "DOI Token (clean): ${DOI_TOKEN}"
      echo "=== DOI Confirm via scan-api.vectigal.tech ==="
      curl -sv "https://scan-api.vectigal.tech/api/webcheck/doi/confirm?token=${DOI_TOKEN}" 2>&1 | grep -E "< HTTP|confirmed|success"
      sleep 5
      echo "=== API-Log: CRM-Routing (Beleg crm=created/exists) ==="
      docker compose logs --tail=100 --no-color api 2>&1 | grep -iE "crm=|crm-lookup-failed|webcheck lead CRM|demo lead CRM" | tail -15 || echo "(no CRM log entry found)"
      echo "=== CRM_WEBHOOK_URL im api-Container ==="
      docker compose exec -T api env | grep CRM_WEBHOOK_URL || echo api-nicht-erreichbar
      echo "=== Cleanup ==="
      docker compose exec -T postgres psql -U "${DB_USER}" -d "${DB_NAME}" \
        -c "DELETE FROM webcheck_leads WHERE email LIKE 'e2e-vec387%'; SELECT count(*) AS remaining FROM webcheck_leads WHERE email LIKE 'e2e-vec387%';"
      echo "=== VEC-387 E2E DONE ==="


# =============================================================================
# CRM-API-Key-Rotation (VEC-398 / Folge VEC-390/391) — API-Only, KEIN DB-Zugriff.
#
# Board-Direktive (VEC-397/VEC-398): KEIN Direkt-DB-Zugriff auf Twenty, KEINE
# Schema-Mutation. Twenty wurde wegen seiner API gewaehlt — die Rotation poked
# nicht mehr ins workspace-Schema (frueher: CREATE TABLE + INSERT via psql).
#
# Recherche Twenty self-hosted v2.9.0 (warum kein vollautomatischer Pfad):
#   - GraphQL-Mutation `createApiKey` existiert, ABER (a) verlangt einen bereits
#     gueltigen Access-Token (RequireAccessTokenGuard) — Henne/Ei genau im
#     Rotationsfall, wenn der Altkey tot ist (401) — und (b) gibt nur die
#     ApiKey-Entity zurueck, NICHT den nutzbaren Token. Token-Minting ist in
#     v2.9.0 ueber die GraphQL-API NICHT exponiert.
#   - CLI `workspace:generate-api-key` liefert zwar einen Token, ist aber hart
#     auf NODE_ENV development|test gegated und wirft in production.
#   => Kein produktionstauglicher headless-Token-Pfad. Token wird daher MANUELL
#      in der Twenty-UI erzeugt (Settings -> Developers -> API Keys -> Create)
#      und als Pipeline-Variable NEW_CRM_API_KEY uebergeben.
#      Runbook: docs/CRM-KEY-ROTATION.md
#
# Dieser Job macht NUR die DB-freie Mechanik:
#   1) Preflight: GL_WRITE_TOKEN + NEW_CRM_API_KEY muessen gesetzt sein.
#   2) Smoke-Test: NEW_CRM_API_KEY gegen Twenty REST (/rest/people) pruefen
#      (erwartet HTTP 200) — verhindert das Ausrollen eines toten Keys.
#   3) CI-Var CRM_API_KEY via GL_WRITE_TOKEN (PUT, masked=true) aktualisieren.
#   4) Redeploy auf main triggern (POST .../pipeline?ref=main) — deploy-auto
#      schreibt den Key aus der CI-Var frisch in die .env.
#
# Secrets-Hygiene: NEW_CRM_API_KEY wird nie geloggt (nur Laenge); per
# --data-urlencode an die GitLab-API bzw. per Container-Env in den Smoke-Test.
#
# Manuell triggerbar (web/api), needs: [] — laeuft ohne erneuten Build/Deploy.
# =============================================================================
ops-rotate-crm-api-key:
  extends: .ops-base
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
      allow_failure: true
  script:
    - cd ${DEPLOY_PATH}
    - |
      set -e

      # ── 1) Preflight ────────────────────────────────────────────────────
      if [ -z "${GL_WRITE_TOKEN}" ]; then
        echo "FATAL: GL_WRITE_TOKEN (GitLab PAT api-Scope + Maintainer) fehlt — CI-Var-Update unmoeglich."
        echo "       GitLab: User Settings -> Access Tokens -> api-Scope -> als CI-Var GL_WRITE_TOKEN setzen."
        exit 1
      fi
      if [ -z "${NEW_CRM_API_KEY}" ]; then
        echo "FATAL: NEW_CRM_API_KEY fehlt — kein Token zum Ausrollen (KEIN DB-Zugriff/Auto-Mint mehr)."
        echo ""
        echo "  Token zuerst MANUELL in Twenty erzeugen (Twenty hat in v2.9.0 keinen"
        echo "  produktionstauglichen headless-Token-Pfad — Details: docs/CRM-KEY-ROTATION.md):"
        echo "    1. Twenty-UI im internen Netz oeffnen: Settings -> Developers -> API Keys"
        echo "    2. 'Create key' -> Name z.B. 'vectiscan-lead-router' -> Token EINMAL kopieren"
        echo "    3. Diesen Job mit Pipeline-Variable NEW_CRM_API_KEY=<token> erneut starten"
        exit 1
      fi
      echo "OK: NEW_CRM_API_KEY praesent (Laenge ${#NEW_CRM_API_KEY}, Wert wird nie geloggt)."

      # ── 2) Smoke-Test: neuen Token gegen Twenty REST pruefen ────────────
      # Aufruf aus dem api-Container (proxy-net -> twenty-server, kein Traefik/401).
      # Token via -e in den exec gereicht, nie als Arg/Log.
      echo "Smoke-Test NEW_CRM_API_KEY gegen Twenty REST /rest/people ..."
      SMOKE=$(docker compose exec -T -e TKN="${NEW_CRM_API_KEY}" api sh -c \
        'curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
          -H "Authorization: Bearer ${TKN}" \
          "http://vectiscan-twenty-server-1:3000/rest/people?limit=1"' 2>/dev/null || echo "000")
      echo "  Twenty REST HTTP ${SMOKE}"
      if [ "${SMOKE}" != "200" ]; then
        echo "FATAL: NEW_CRM_API_KEY wird von Twenty NICHT akzeptiert (HTTP ${SMOKE}, erwartet 200)."
        echo "       Key in Twenty pruefen/neu erzeugen — CI-Var bleibt unveraendert (kein toter Key ausgerollt)."
        exit 1
      fi
      echo "  PASS: Token gueltig (Twenty antwortet 200)."

      # ── 3) CI-Var CRM_API_KEY aktualisieren ─────────────────────────────
      echo "Aktualisiere CI-Var CRM_API_KEY (maskiert, Wert nie geloggt) ..."
      GL_VARS_API="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/variables"
      HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${GL_VARS_API}/CRM_API_KEY" \
        -H "PRIVATE-TOKEN: ${GL_WRITE_TOKEN}" \
        --data-urlencode "value=${NEW_CRM_API_KEY}" \
        -d "masked=true&protected=false&variable_type=env_var")
      if [ "${HTTP}" = "404" ]; then
        HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${GL_VARS_API}" \
          -H "PRIVATE-TOKEN: ${GL_WRITE_TOKEN}" \
          --data-urlencode "key=CRM_API_KEY" \
          --data-urlencode "value=${NEW_CRM_API_KEY}" \
          -d "masked=true&protected=false&variable_type=env_var")
      fi
      echo "  CRM_API_KEY-Update: HTTP ${HTTP}"
      [ "${HTTP}" = "200" ] || [ "${HTTP}" = "201" ] || { echo "FATAL: CI-Var-Update fehlgeschlagen (HTTP ${HTTP})."; exit 1; }

      # ── 4) Redeploy triggern ────────────────────────────────────────────
      echo "Triggere Redeploy (main-Pipeline) ..."
      PIPE_HTTP=$(curl -s -o /tmp/pipe.json -w "%{http_code}" -X POST \
        "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/pipeline?ref=main" \
        -H "PRIVATE-TOKEN: ${GL_WRITE_TOKEN}")
      echo "  Pipeline-Trigger: HTTP ${PIPE_HTTP}"
      if [ "${PIPE_HTTP}" = "200" ] || [ "${PIPE_HTTP}" = "201" ]; then
        PIPE_ID=$(sed -n 's/.*"id":\([0-9]*\).*/\1/p' /tmp/pipe.json | head -1)
        echo "  Neue Pipeline: ${PIPE_ID} (deploy-auto schreibt den rotierten Key in die .env)."
      else
        echo "WARN: Redeploy-Trigger fehlgeschlagen (HTTP ${PIPE_HTTP}). CI-Var ist bereits rotiert —"
        echo "      einen main-Deploy manuell ausloesen, dann ops-e2e-vec387 verifizieren."
      fi

      echo "=== CRM-API-Key-Rotation abgeschlossen (API-Only, kein DB-Zugriff) ==="
      echo "  Naechster Schritt: nach Deploy ops-e2e-vec387 -> erwartet crm=created|exists."
