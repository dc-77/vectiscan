id: header_duplicate
title: HTTP-Antwortheader mehrfach gesetzt
family: header_duplicate
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: http
applicable_when: null
when: len(http.duplicate_headers) > 0
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [header_check]
kind: check
bundle: web_header_hygiene
affected_template: "{fqdn} ({duplicate_headers})"
evidence: [http]
references: [CWE-693]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-011
  start_level: niedrig
  deviation: null
texts:
  short: "doppelt gesetzte Header"
  plan:
    lever: "Doppelt gesetzte Header bereinigen"
    effect: "Sorgt für eindeutige Anweisungen an den Browser"
  observation: >-
    {n:Die Webantwort|Die Webantworten} von {group} {n:enthält|enthalten} denselben Antwortheader mehrfach mit unterschiedlichen
    Werten: {affected}.
  meaning: >-
    Browser und vorgelagerte Systeme werten mehrfach gesetzte Header uneinheitlich aus, manche
    nehmen den ersten, andere den letzten Wert. Damit ist nicht sichergestellt, welche der
    gesetzten Schutzwirkungen tatsächlich beim Browser ankommt.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Webserver- und Anwendungskonfiguration darauf prüfen, an welcher Stelle der doppelte
        Header gesetzt wird, und den Header nur noch an einer Stelle mit einem eindeutigen Wert
        ausliefern.
  verify: >-
    HTTP-Antwortheader der genannten Adresse von außen abrufen; erwartet wird jeder Header genau
    einmal mit einem eindeutigen Wert.
