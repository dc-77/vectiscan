id: header_duplicate
title: HTTP-Antwortheader mehrfach gesetzt
family: header_duplicate
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: http
applicable_when: null
when: len(http.duplicate_headers) > 0
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [header_check]
kind: check
bundle: null
affected_template: "{fqdn} ({duplicate_headers})"
evidence: [http]
references: [CWE-693]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-011
  start_level: niedrig
  deviation: null
texts:
  observation: >-
    Die Webantwort von {group} enthaelt denselben Antwortheader mehrfach mit unterschiedlichen
    Werten: {affected}.
  meaning: >-
    Browser und vorgelagerte Systeme werten mehrfach gesetzte Header uneinheitlich aus, manche
    nehmen den ersten, andere den letzten Wert. Damit ist nicht sichergestellt, welche der
    gesetzten Schutzwirkungen tatsaechlich beim Browser ankommt.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Webserver- und Anwendungskonfiguration darauf pruefen, an welcher Stelle der doppelte
        Header gesetzt wird, und den Header nur noch an einer Stelle mit einem eindeutigen Wert
        ausliefern.
  verify: >-
    HTTP-Antwortheader der genannten Adresse von aussen abrufen; erwartet wird jeder Header genau
    einmal mit einem eindeutigen Wert.
