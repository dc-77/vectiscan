id: smb_exposed
title: SMB-Dienst aus dem Internet erreichbar
family: smb_exposed
category: A
scale: exposure
level: kritisch
group_by: host
scope: service
applicable_when: null
when: service.port in [139, 445]
positive_when: absent
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: remote_admin_closed
affected_template: "{host_ip}:{port} ({service})"
evidence: [service]
references: [CWE-284, OWASP2025-A05]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-SMB-EXPOSED
  start_level: kritisch
  deviation: null
texts:
  short: "Dateifreigabe (SMB) erreichbar"
  plan:
    lever: "Dateifreigaben vom Internet trennen"
    effect: "Schließt einen der häufigsten Einstiegspunkte für Erpressungsangriffe"
  observation: >-
    {n:Der Host|Die Hosts} {group} {n:beantwortet|beantworten} Verbindungen auf SMB-Freigabeports aus dem gesamten Internet:
    {affected}. Ein Datei- und Freigabedienst gehört nicht an das öffentliche Interface.
  meaning: >-
    Ein von außen erreichbarer SMB-Dienst erlaubt Passwort-Rateangriffe rund um die Uhr und macht
    bekannte Schwachstellen der Dateifreigabe sofort ausnutzbar. Betroffen wären die auf den
    Freigaben abgelegten Dateien und, bei erfolgreichem Zugriff, angebundene Systeme im internen
    Netz.
  recommendation:
    - stage: unverzueglich
      text: >-
        Den externen Zugriff auf die SMB-Ports in der Firewall oder in der Verwaltung des Hosters
        deaktivieren. Dateifreigaben ausschließlich innerhalb des internen Netzes anbieten.
    - stage: in_kuerze
      text: >-
        Zugriffsprotokolle der Freigabe auf fremde Anmeldeversuche prüfen und betroffene
        Zugangsdaten vorsorglich ändern.
    - stage: mittelfristig
      text: >-
        Fernzugriff auf Dateifreigaben ausschließlich über ein VPN zulassen.
  # S7a (spec/11 Teil 5): keine festen Portnummern; ein Host kann nur 445 oder nur 139 anbieten.
  verify: >-
    Portscan der genannten SMB-Ports von einer externen Adresse aus wiederholen; erwartet wird der
    Zustand gefiltert oder geschlossen.
  positive:
    title: Kein SMB-Dienst aus dem Internet erreichbar
    text: >-
      Auf {group} antwortet kein SMB-Dienst auf Verbindungen von außen.
