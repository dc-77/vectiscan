id: cert_expiring
title: TLS-Zertifikat läuft in Kürze ab
family: cert_expiring
category: D
scale: hygiene
level: hoch
group_by: fqdn
scope: tls
applicable_when: null
when: tls.cert is not None and tls.cert.expired is not True and tls.cert.days_left <= CERT_SOON_DAYS
# S6b-2 (E2): bis sieben Tage Restlaufzeit rot und Unverzueglich (levels.URGENT_EXCEPTIONS).
urgent_when: tls.cert.days_left <= CERT_URGENT_DAYS
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [testssl]
kind: check
bundle: cert_health
# S6b-3 (spec/10 R18, E12): absolutes Datum statt relativer Frist.
affected_template: "{target} ({validity_text})"
evidence: [tls]
references: [CWE-298]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-TLS-005
  start_level: LOW
  deviation: >-
    SP-TLS-005 bewertet ein bald ablaufendes Zertifikat mit LOW. Abweichend fuehrt die
    Katalogsimulation (R-CERT-EXPIRING) den Befund als Hygiene hoch, weil der bevorstehende Ablauf
    den Dienst fuer alle Nutzer stoppt, sobald er eintritt. Entscheidung DC E2 (S6b-2): bis 14
    Tage Hygiene hoch, bis sieben Tage als Ausnahme Unverzueglich, 15 bis 30 Tage
    cert_expiring_later.
texts:
  short: "Zertifikat läuft in Kürze ab"
  # S6b-4 (spec/11 T14): liegt der Ablauf vor dem Berichtsdatum, sagen Titel, Hebel und Plan
  # das (castenow mailstore: Ablauf 24.09.2026, Berichtsdatum danach).
  short_variants:
    - when: days_until(tls.cert.not_after, report_date) < 0
      text: "Zertifikat am Berichtsdatum abgelaufen, sofern nicht erneuert"
  plan:
    lever: "Zertifikate vor dem Ablauf erneuern"
    effect: "Verhindert den Ausfall des Dienstes zum Ablaufdatum des Zertifikats"
    # S6b-4n (spec/11 N8): auch Hebel und Effekt sagen "sofern nicht erneuert"; ob das Zertifikat
    # nach dem Scan erneuert wurde, belegt keine Messung.
    lever_variants:
      - when: days_until(tls.cert.not_after, report_date) < 0
        text: "Am Berichtsdatum abgelaufenes Zertifikat ersetzen, sofern nicht erneuert"
    effect_variants:
      - when: days_until(tls.cert.not_after, report_date) < 0
        text: "Beseitigt die Vertrauenswarnung, die nach dem Ablauf beim Aufruf erscheint, sofern das Zertifikat nicht erneuert ist"
  observation:
    - when: days_until(tls.cert.not_after, report_date) >= 0
      quantor: eines
      text: >-
        Für {n:den Dienst|die Dienste} {group} läuft das eingesetzte TLS-Zertifikat in Kürze ab: {affected}. Ohne
        rechtzeitige Erneuerung entsteht die gleiche Wirkung wie bei einem bereits abgelaufenen
        Zertifikat.
    - when: days_until(tls.cert.not_after, report_date) < 0
      quantor: eines
      text: >-
        Für {n:den Dienst|die Dienste} {group} lief das eingesetzte TLS-Zertifikat kurz nach dem Scan ab: {affected}.
        Ist es inzwischen nicht erneuert, sehen alle Nutzer eine Vertrauenswarnung.
  meaning:
    - when: days_until(tls.cert.not_after, report_date) >= 0
      quantor: eines
      text: >-
        Läuft das Zertifikat ab, ohne dass eine Erneuerung vorbereitet ist, ist der Dienst für alle
        Nutzer mit einer Vertrauenswarnung oder einem Verbindungsabbruch konfrontiert. Ein kurzes
        Zeitfenster reicht oft nicht aus, um eine Erneuerung ungeplant nachzuholen.
    # S6b-4n (spec/11 N8): am Berichtsdatum abgelaufen, sofern nicht erneuert.
    - when: days_until(tls.cert.not_after, report_date) < 0
      quantor: eines
      text: >-
        Am Berichtsdatum ist das Zertifikat abgelaufen, sofern es nicht erneuert wurde; dann sehen
        alle Nutzer des Dienstes eine Vertrauenswarnung oder die Verbindung bricht ab.
  recommendation:
    - stage: in_kuerze
      when: len(tls.cert.valid_elsewhere) > 0
      quantor: eines
      text: >-
        Für denselben Namen ist an {valid_elsewhere} bereits ein gültiges Zertifikat eingesetzt;
        dieses Zertifikat auch hier einspielen.
    - stage: in_kuerze
      when: days_until(tls.cert.not_after, report_date) >= 0 and len(tls.cert.valid_elsewhere) == 0
      quantor: eines
      text: >-
        Ein neues Zertifikat für den betroffenen Dienst rechtzeitig vor dem Ablaufdatum
        ausstellen und einspielen.
    - stage: in_kuerze
      when: days_until(tls.cert.not_after, report_date) < 0 and len(tls.cert.valid_elsewhere) == 0
      quantor: eines
      text: >-
        Prüfen, ob das Zertifikat seit dem Ablauf erneuert wurde, und es andernfalls durch ein
        gültiges ersetzen.
    - stage: strategisch
      when: tls.cert.renewal is None or len(tls.cert.renewal.recent_leads) == 0
      text: >-
        Eine automatisierte Erneuerung des Zertifikats mit ausreichendem zeitlichem Vorlauf vor
        dem Ablauf einrichten.
  verify: >-
    Verbindung zum Dienst mit einem TLS-Client aufbauen und das Ablaufdatum des präsentierten
    Zertifikats prüfen; erwartet wird ein neues Zertifikat mit ausreichendem Vorlauf bis zum
    Ablauf.
