id: cert_expiring
title: TLS-Zertifikat läuft in Kürze ab
family: cert_expiring
category: D
scale: hygiene
level: hoch
group_by: fqdn
scope: tls
applicable_when: null
when: tls.cert is not None and tls.cert.expired is not True and tls.cert.days_left <= CERT_SOON_DAYS
# S6b-2 (E2): bis sieben Tage Restlaufzeit rot und Unverzueglich (levels.URGENT_EXCEPTIONS).
urgent_when: tls.cert.days_left <= CERT_URGENT_DAYS
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [testssl]
kind: check
bundle: cert_health
affected_template: "{target} ({days_left_text})"
evidence: [tls]
references: [CWE-298]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-TLS-005
  start_level: LOW
  deviation: >-
    SP-TLS-005 bewertet ein bald ablaufendes Zertifikat mit LOW. Abweichend fuehrt die
    Katalogsimulation (R-CERT-EXPIRING) den Befund als Hygiene hoch, weil der bevorstehende Ablauf
    den Dienst fuer alle Nutzer stoppt, sobald er eintritt. Entscheidung DC E2 (S6b-2): bis 14
    Tage Hygiene hoch, bis sieben Tage als Ausnahme Unverzueglich, 15 bis 30 Tage
    cert_expiring_later.
texts:
  short: "Zertifikat läuft in Kürze ab"
  plan:
    lever: "Zertifikate vor dem Ablauf erneuern"
    effect: "Verhindert den Ausfall des Dienstes zum Ablaufdatum des Zertifikats"
  observation: >-
    Für {n:den Dienst|die Dienste} {group} läuft das eingesetzte TLS-Zertifikat in Kürze ab: {affected}. Ohne
    rechtzeitige Erneuerung entsteht die gleiche Wirkung wie bei einem bereits abgelaufenen
    Zertifikat.
  meaning: >-
    Läuft das Zertifikat ab, ohne dass eine Erneuerung vorbereitet ist, ist der Dienst für alle
    Nutzer mit einer Vertrauenswarnung oder einem Verbindungsabbruch konfrontiert. Ein kurzes
    Zeitfenster reicht oft nicht aus, um eine Erneuerung ungeplant nachzuholen.
  recommendation:
    - stage: in_kuerze
      text: >-
        Ein neues Zertifikat für den betroffenen Dienst rechtzeitig vor dem Ablaufdatum
        ausstellen und einspielen.
    - stage: strategisch
      text: >-
        Eine automatisierte Erneuerung des Zertifikats mit ausreichendem zeitlichem Vorlauf vor
        dem Ablauf einrichten.
  verify: >-
    Verbindung zum Dienst mit einem TLS-Client aufbauen und das Ablaufdatum des präsentierten
    Zertifikats prüfen; erwartet wird ein neues Zertifikat mit ausreichendem Vorlauf bis zum
    Ablauf.
