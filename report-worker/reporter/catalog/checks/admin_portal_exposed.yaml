id: admin_portal_exposed
title: Verwaltungsoberfläche über die Webseite erreichbar
family: admin_service_exposed
category: A
scale: exposure
level: erhoeht
group_by: fqdn
scope: fqdn
applicable_when: null
when: fqdn.http_status == 200 and matches(fqdn.title, ADMIN_TITLES)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [web_probe]
kind: check
bundle: admin_access
affected_template: "{fqdn} ({title})"
evidence: [fqdn]
references: [CWE-284, CISA-KEV]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-ADMIN-EXPOSED (Titel)
  start_level: erhoeht
  deviation: >-
    Erkennung ueber den Titel der Startseite ergaenzt die portbasierte Pruefung
    admin_service_exposed; beide Wege fuehren zur gleichen Familie und Einstufung Exposition
    erhoeht (catalog_sim R-ADMIN-EXPOSED).
texts:
  short: "Verwaltungsoberfläche laut Seitentitel"
  plan:
    lever: "Verwaltungsoberflächen vom Internet trennen"
    effect: "Entzieht Angreifern den direkten Zugang zur Verwaltung der Systeme"
  observation: >-
    {n:Die Webseite|Die Webseiten} {group} {n:zeigt|zeigen} auf {n:ihrer Startseite|ihren Startseiten} eine Verwaltungs- oder Anmeldeoberfläche,
    die aus dem gesamten Internet erreichbar ist: {affected}. Eine Zugriffsbeschränkung auf
    bestimmte Quellnetze ist von außen nicht erkennbar.
  # S6b-3 (spec/10 R13): "Anschluss" nur bei einer eigenen Leitung des Kunden.
  meaning:
    - when: host.betriebsform == "anschluss"
      quantor: eines
      text: >-
        Verwaltungsoberflächen sind ein hochwertiges Ziel: Eine Übernahme betrifft den gesamten
        Anschluss mit den dahinter liegenden Systemen.
    - when: host.betriebsform != "anschluss"
      quantor: eines
      text: >-
        Verwaltungsoberflächen sind ein hochwertiges Ziel: Eine Übernahme betrifft das gesamte
        System und alle Dienste darauf.
    - text: >-
        Angreifer können Anmeldedaten erraten oder bekannte Schwachstellen der
        Verwaltungssoftware ausnutzen.
  recommendation:
    - stage: unverzueglich
      text: >-
        Zugriff auf die Verwaltungsoberfläche auf die benötigten Quellnetze beschränken, etwa
        über die Firewall des Hosters, eine Zugriffsliste oder ein VPN.
    - stage: in_kuerze
      text: >-
        Mehrfaktor-Anmeldung für die Verwaltungsoberfläche aktivieren und Standardkonten
        deaktivieren oder umbenennen.
    - stage: mittelfristig
      text: >-
        Softwarestand der Verwaltungsoberfläche gegen die Sicherheitshinweise des Herstellers
        abgleichen und Anmeldeversuche überwachen.
  verify: >-
    Die genannte Adresse von einer externen Adresse außerhalb der freigegebenen Quellnetze
    aufrufen; erwartet wird eine Ablehnung durch die Zugriffsbeschränkung statt der
    Anmeldemaske.
