id: smtp_vrfy_enabled_passive
title: Mailserver beantwortet den Befehl VRFY laut Passivquelle
family: smtp_vrfy
category: E
scale: hygiene
level: niedrig
group_by: host
scope: passive
applicable_when: null
item_when: null
when: passive.source == "shodan" and passive.verified is not True and passive.details["smtp_vrfy"] is True
# S6b-4 (spec/11 T11, E22): blauer Hinweis auf Hosts, die vom Pruefstand aus nicht erreichbar sind.
hint_when: host.reach is not None and host.reach.status in ["unreachable_from_scanner", "no_response"]
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [shodan]
kind: check
bundle: smtp_commands
affected_template: "{host_ip}:{port} (laut Passivquelle, {seen_text})"
evidence: [passive]
references: [CWE-200, CWE-204]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: S6b-3 (spec/10 R19)
  start_level: niedrig
  deviation: null
texts:
  short: "VRFY angeboten laut Passivquelle"
  plan:
    lever: "Befehl VRFY am Mailserver abschalten"
    effect: "Verhindert die Abfrage gültiger Postfachnamen"
  observation:
    - text: >-
        Laut Passivquelle nennt der Mailserver auf {group} den Befehl VRFY in seiner Antwort auf
        EHLO: {affected}.
    # S6b-4 (spec/11 T1, T11): warum der Portscan den Port nicht bestaetigt, je Fall.
    - when: host.reach is not None and host.reach.status in ["unreachable_from_scanner", "no_response"]
      quantor: eines
      text: >-
        Der Host ist vom Prüfstand aus nicht erreichbar; die Angabe der Passivquelle ist deshalb
        nicht bestätigt.
    - when: (host.reach is None or host.reach.status not in ["unreachable_from_scanner", "no_response"]) and passive.port == 25
      quantor: eines
      text: >-
        Port 25 ist vom Prüfstand aus nicht prüfbar; die Angabe der Passivquelle ist deshalb nicht
        bestätigt.
    - when: (host.reach is None or host.reach.status not in ["unreachable_from_scanner", "no_response"]) and passive.port != 25
      quantor: eines
      text: >-
        Der Portscan hat den Port nicht bestätigt.
  meaning: >-
    Mit VRFY lassen sich gültige Postfachnamen ermitteln. Das erleichtert gezielte
    Phishing-Mails und Rateangriffe auf Zugangsdaten.
  recommendation:
    - stage: in_kuerze
      text: >-
        Prüfen, ob der Mailserver den Befehl VRFY beantwortet, und ihn gegebenenfalls
        abschalten.
    - stage: mittelfristig
      text: >-
        Den Befehl VRFY in der Konfiguration des Mailservers abschalten, bei Postfix über
        disable_vrfy_command.
  verify: >-
    Verbindung zum Mailserver aufbauen und VRFY mit einem bekannten Postfachnamen senden;
    erwartet wird eine Ablehnung ohne Aussage über das Postfach.
