id: smtp_vrfy_enabled_passive
title: Mailserver beantwortet den Befehl VRFY laut Passivquelle
family: smtp_vrfy
category: E
scale: hygiene
level: niedrig
group_by: host
scope: passive
applicable_when: null
item_when: null
when: passive.source == "shodan" and passive.verified is not True and passive.details["smtp_vrfy"] is True
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [shodan]
kind: check
bundle: smtp_commands
affected_template: "{host_ip}:{port} (laut Passivquelle, gesehen am {seen_date})"
evidence: [passive]
references: [CWE-200, CWE-204]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: S6b-3 (spec/10 R19)
  start_level: niedrig
  deviation: null
texts:
  short: "VRFY laut Passivquelle"
  plan:
    lever: "Befehl VRFY am Mailserver abschalten"
    effect: "Verhindert die Abfrage gültiger Postfachnamen"
  observation: >-
    Laut Passivquelle bietet der Mailserver auf {group} den Befehl VRFY an: {affected}. Der
    Portscan hat den Port nicht bestätigt.
  meaning: >-
    Mit VRFY lassen sich gültige Postfachnamen ermitteln. Das erleichtert gezielte
    Phishing-Mails und Rateangriffe auf Zugangsdaten.
  recommendation:
    - stage: in_kuerze
      text: >-
        Prüfen, ob der Mailserver den Befehl VRFY beantwortet, und ihn gegebenenfalls
        abschalten.
    - stage: mittelfristig
      text: >-
        Den Befehl VRFY in der Konfiguration des Mailservers abschalten, bei Postfix über
        disable_vrfy_command.
  verify: >-
    Verbindung zum Mailserver aufbauen und VRFY mit einem bekannten Postfachnamen senden;
    erwartet wird eine Ablehnung ohne Aussage über das Postfach.
