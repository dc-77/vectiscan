id: domain_expiring
title: Domain-Registrierung läuft in Kürze ab
family: domain_expiring
category: E
scale: hygiene
level: hoch
group_by: domain
scope: target
applicable_when: null
when: days_until(target.whois.expires_at, scan.finished_at) <= DOMAIN_EXPIRING_DAYS
positive_when: days_until(target.whois.expires_at, scan.finished_at) > DOMAIN_EXPIRING_DAYS
not_testable_when:
  - when: coverage_status("whois") != "ok"
    reason_code: "coverage:whois"
    context: group
  - when: target.whois is None or target.whois.expires_at is None
    reason_code: whois_unavailable
    context: item
undetermined: not_testable
requires:
  tools: [whois]
kind: check
bundle: null
affected_template: "{domain} (Ablauf {expires_at})"
evidence: [target]
references: [CWE-16]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: neu (S2-Auftrag)
  start_level: hoch
  deviation: null
texts:
  plan:
    lever: "Domain-Registrierung verlängern"
    effect: "Verhindert den Verlust der Domain zum Ablaufdatum"
  observation: >-
    Für {affected} läuft die Registrierung der Domain {domain} innerhalb der nächsten 30
    Tage ab.
  meaning: >-
    Nach Ablauf der Registrierung kann die Domain nur noch für eine kurze Frist verlängert
    werden, danach fällt sie zurück in die allgemeine Vergabe und kann von Dritten neu
    registriert werden. Damit gehen Website, E-Mail-Zustellung und alle auf diese Domain
    ausgestellten Zertifikate verloren.
  recommendation:
    - stage: unverzueglich
      text: >-
        Die Verlängerung der Domain-Registrierung veranlassen und eine automatische
        Verlängerung für künftige Ablauftermine einrichten.
  verify: >-
    WHOIS-Abfrage der Domain {domain}; erwartet wird ein Ablaufdatum, das mehr als 30 Tage in
    der Zukunft liegt.
  positive:
    title: Domain-Registrierung läuft nicht in Kürze ab
    text: >-
      Für die Domain {domain} liegt das Ablaufdatum der Registrierung mehr als 30 Tage in der
      Zukunft.
