id: service_banner_version
title: Dienst gibt Versionskennung preis
family: banner_version_disclosure
category: E
scale: hygiene
level: niedrig
group_by: host
scope: service
applicable_when: null
# S6b-2 (spec/09 Q4): SSH-Banner und MariaDB/MySQL-Handshake tragen die Version als Teil
# des Protokolls; sie laesst sich nicht abschalten und ist kein Befund.
# S6b-2 (spec/09 Q4 LW, JW): "9.6.0 or later" ist die Untergrenze, die nmap aus dem
# Protokoll ableitet; der Dienst selbst nennt keine Version ("PostgreSQL unbekannt").
when: has_version(service.version_raw) and service.port not in WEB_PORTS and not matches(service.service, BANNER_FIXED) and not matches(service.product, BANNER_FIXED) and not matches(service.version_raw, VERSION_LOWER_BOUND)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: banner_disclosure
affected_template: "{host_ip}:{port} ({product} {version})"
evidence: [service]
references: [CWE-200]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DISC-001
  start_level: LOW
  deviation: null
texts:
  short: "Versionsangabe im Dienstbanner"
  plan:
    lever: "Versionsangaben aus den Dienstbannern entfernen"
    effect: "Erschwert die gezielte Suche nach passenden Schwachstellen"
  observation: >-
    Der Dienst auf {group} gibt beim Verbindungsaufbau seine Produkt- und Versionskennung
    preis: {affected}.
  meaning: >-
    Eine sichtbare Versionskennung erleichtert die gezielte Suche nach bekannten Schwachstellen
    für genau diese Version und beschleunigt damit die Vorbereitung eines Angriffs.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Versionsausgabe des Dienstes in der Konfiguration unterdrücken oder, sofern der
        Dienst dies unterstützt, auf eine allgemeine Kennung ohne Versionsnummer umstellen.
    - stage: strategisch
      text: >-
        Den Dienst unabhängig von der sichtbaren Kennung regelmäßig auf verfügbare
        Aktualisierungen prüfen.
  verify: >-
    Verbindungsaufbau zum Dienst von außen wiederholen und die zurückgegebene Kennung mit der
    internen Versionsübersicht abgleichen.
