id: legacy_protocols_present
title: Veraltetes Übertragungsprotokoll aus dem Internet erreichbar
family: legacy_protocols_present
category: A
scale: hygiene
level: niedrig
group_by: host
scope: service
applicable_when: null
# S6b-2 (spec/08 Punkt 4, spec/09 Q4): ein Port steht in genau einem Befund. Ports mit
# belegter Anmeldung ohne TLS meldet plaintext_services; die Erzwingung ist hier ausgewertet.
when: service.port in LEGACY_PORTS and not (service.port == 21 and service.tls_required is False and service.tunnel_ssl is False) and not (service.port in [110, 143] and service.tunnel_ssl is False and service.tls_required is not True and (service.starttls is False or service.tls_required is False))
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: null
affected_template: "{host_ip}:{port} ({legacy_name})"
evidence: [service]
references: [CWE-477, OWASP2025-A05]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-005
  start_level: niedrig
  deviation: null
texts:
  plan:
    lever: "Nicht benötigte Altprotokolle abschalten"
    effect: "Verkleinert die Angriffsfläche um selten gepflegte Dienste"
  observation:
    - text: >-
        {n:Der Host|Die Hosts} {group} {n:bietet|bieten} ein älteres Übertragungsprotokoll an, das zur Angriffsfläche des
        Anschlusses zählt: {affected}.
    - when: service.tls_required is True or service.tunnel_ssl is True
      quantor: eines
      text: >-
        Eine Anmeldung ist dort nur mit Transportverschlüsselung möglich: {affected}.
    - when: service.tls_required is None and service.tunnel_ssl is False
      quantor: eines
      text: >-
        Ob dort eine Anmeldung ohne Transportverschlüsselung abgelehnt wird, ließ sich von außen
        nicht feststellen: {affected}.
  meaning: >-
    Jeder zusätzlich erreichbare Dienst vergrößert die Angriffsfläche des Anschlusses,
    unabhängig davon, ob er eine Verschlüsselung anbietet oder erzwingt. Altprotokolle bringen
    zudem eigene, seltener gepflegte Serverkomponenten mit.
  recommendation:
    - stage: in_kuerze
      text: >-
        Prüfen, ob der Dienst noch benötigt wird, und ihn andernfalls deaktivieren.
    - stage: mittelfristig
      text: >-
        Falls der Dienst benötigt wird, den Zugriff auf feste Quelladressen beschränken und eine
        erzwungene Verschlüsselung sicherstellen.
  verify: >-
    Portscan des betroffenen Ports von einer externen Adresse aus wiederholen; erwartet wird der
    Zustand gefiltert oder geschlossen, sofern der Dienst nicht mehr benötigt wird.
