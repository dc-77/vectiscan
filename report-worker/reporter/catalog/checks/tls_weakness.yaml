id: tls_weakness
title: TLS-Verschlüsselung anfällig für bekannte Angriffe
family: tls_weakness
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: tls.vulns
applicable_when: null
# S6b-2 (spec/09 Q4): BREACH und LUCKY13 meldet tls_weakness_reported im Anhang.
when: 'vuln.name in TLS_SOFT_VULNS and vuln.status == "vulnerable"'
positive_when: never
not_testable_when:
  - when: 'vuln.status == "not_tested"'
    reason_code: testssl_nicht_getestet
    context: item
undetermined: not_testable
requires:
  tools: [testssl]
kind: check
bundle: tls_hardening
affected_template: "{target} ({name})"
evidence: [tls]
references: [CWE-327]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-TLS-VULN-SOFT
  start_level: niedrig
  deviation: null
texts:
  short: "bekannte Schwäche der Verschlüsselung"
  plan:
    lever: "Bekannte Schwächen der TLS-Konfiguration beheben"
    effect: "Schützt Verbindungen gegen bekannte Angriffe"
  observation: >-
    Die TLS-Analyse meldet auf {group} eine bekannte Schwäche der Verschlüsselung mit
    geringerer Auswirkung: {affected}.
  meaning: >-
    Unter bestimmten Voraussetzungen, etwa bei sehr langen Sitzungen, ermöglichen diese
    Schwächen bekannte Angriffe auf die Verschlüsselung.
    Für sich genommen ist die Auswirkung gering, in Kombination mit weiteren Schwachstellen
    steigt sie.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die betroffenen Verfahren in der Serverkonfiguration deaktivieren, sofern die
        eingesetzte Softwareversion dies zulässt.
  verify: >-
    TLS-Analyse des Dienstes von außen wiederholen; erwartet wird ein Ergebnis ohne diese
    Schwachstelle.
