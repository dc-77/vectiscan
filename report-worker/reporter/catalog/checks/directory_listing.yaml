id: directory_listing
title: Verzeichnisinhalt des Webservers einsehbar
family: directory_listing
category: E
scale: hygiene
level: mittel
group_by: fqdn
scope: http.alerts
applicable_when: null
# S6d (A7, spec/11 N2): nur Meldungen an der Zielseite, nicht an Abwehr-, Fehler- oder Nebenseiten.
when: zap_match(alert, ZAP_DIRECTORY_LISTING) and alert.location == "target"
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [zap]
kind: check
bundle: null
affected_template: "{fqdn} ({url_path})"
evidence: [http]
references: [CWE-548]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DISC-005
  start_level: LOW
  deviation: >-
    SP-DISC-005 bewertet eine einsehbare Verzeichnisauflistung mit LOW; die Simulation
    (catalog_sim) fuehrt die Familie als Hygiene mittel, weil ein einsehbares Verzeichnis
    unmittelbar Dateinamen und Struktur offenlegt. Diese Umsetzung folgt catalog_sim.
texts:
  plan:
    lever: "Verzeichnisanzeige am Webserver abschalten"
    effect: "Verbirgt Dateien, die nicht für Besucher bestimmt sind"
  observation: >-
    Die passive Webanalyse hat auf {group} ein einsehbares Verzeichnis ohne eigene Startseite
    gefunden: {affected}.
  meaning: >-
    Ein einsehbares Verzeichnis legt Dateinamen und Struktur offen, die sonst nicht sichtbar
    wären, und kann so den Zugriff auf Dateien erleichtern, die nicht für die öffentliche
    Ansicht bestimmt sind.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Verzeichnisauflistung in der Webserverkonfiguration deaktivieren oder eine
        Startseite in das betroffene Verzeichnis legen.
  verify: >-
    Den gemeldeten Pfad im Browser aufrufen; erwartet wird eine Fehlermeldung oder eine
    Weiterleitung statt einer Dateiliste.
