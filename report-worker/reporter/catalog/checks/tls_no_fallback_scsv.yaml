id: tls_no_fallback_scsv
title: Kein Schutz vor Downgrade-Angriffen durch Fallback SCSV
family: tls_no_fallback_protection
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: tls
applicable_when: null
when: 'tls.fallback_scsv is False and (tls.protocols["TLS1.0"] is True or tls.protocols["TLS1.1"] is True)'
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [testssl]
kind: check
bundle: tls_hardening
affected_template: "{target}"
evidence: [tls]
references: [CWE-757]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-012
  start_level: niedrig
  deviation: null
texts:
  short: "kein Schutz vor Rückstufung"
  plan:
    lever: "Schutz gegen erzwungene Rückstufung aktivieren"
    effect: "Verhindert, dass ein Angreifer eine ältere Protokollversion erzwingt"
  observation: >-
    {n:Der Dienst|Die Dienste} {group} {n:bietet|bieten} noch veraltete Protokollversionen an und signalisiert dabei keinen
    Fallback-SCSV-Schutz vor einer erzwungenen Rückstufung der Verbindung: {affected}.
  meaning: >-
    Ohne dieses Signal kann eine Gegenstelle auf dem Übertragungsweg einen Verbindungsabbruch
    erzwingen, der Client und Server zu einer älteren, schwächeren Protokollversion greifen
    lässt. Relevant ist das nur, solange der Dienst diese älteren Versionen überhaupt noch
    anbietet.
  recommendation:
    - stage: mittelfristig
      text: >-
        Fallback SCSV in der TLS-Konfiguration aktivieren oder, alternativ, die veralteten
        Protokollversionen vollständig abschalten.
  verify: >-
    Verbindungsversuch mit einer erzwungenen Rückstufung gegen den Dienst durchführen;
    erwartet wird eine Ablehnung durch den Server.
