id: dane_missing
title: DANE für SMTP nicht eingerichtet
family: dane_missing
category: C
scale: hygiene
level: niedrig
group_by: domain
scope: dns
applicable_when: len(dns.mx) > 0
when: dns.dane is not None and dns.dane.smtp is False
positive_when: dns.dane is not None and dns.dane.smtp is True
not_testable_when:
  - when: dns.dane is None or dns.dane.smtp is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [dns_security]
kind: check
bundle: mail_transport_enforcement
affected_template: "{domain}"
evidence: [dns]
references: [CWE-295, CWE-319]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-008
  start_level: niedrig
  deviation: >-
    Der Prototyp fuehrt DANE fuer SMTP unter VS-008 ohne eigene Zahlenbewertung; die Einstufung
    Hygiene niedrig folgt der Einordnung der uebrigen Transportabsicherungen (MTA-STS, TLS-RPT),
    da DANE erst zusammen mit DNSSEC wirkt und in der Praxis selten flaechendeckend eingerichtet
    ist.
texts:
  observation: >-
    Für {affected} sind keine DANE-Einträge für den SMTP-Übertragungsweg hinterlegt. Für
    die Domain {domain} lassen sich die Zertifikate der Mailserver damit nicht zusätzlich
    über DNSSEC-gesicherte TLSA-Einträge verankern.
  meaning: >-
    Ohne DANE verlassen sich sendende Mailserver bei der Transportverschlüsselung allein auf
    die öffentliche Zertifizierungsstelleninfrastruktur. Ein Angreifer, der ein Zertifikat
    über eine kompromittierte oder fehlgeleitete Ausstellung erhält, bleibt ohne DANE
    unentdeckt, während ein DNSSEC-verankerter TLSA-Eintrag die erwarteten Zertifikatsdaten
    der Mailserver festschreibt.
  recommendation:
    - stage: strategisch
      text: >-
        Für die Mailserver TLSA-Einträge veröffentlichen, sobald die Domain DNSSEC-signiert
        ist, und die Einträge bei jedem Zertifikatswechsel aktualisieren.
  verify: >-
    DNS-Abfrage des TLSA-Eintrags unter _25._tcp.<mailserver> für jeden in den MX-Einträgen
    genannten Mailserver; erwartet wird ein signierter Eintrag, der zum eingesetzten
    Zertifikat passt.
  positive:
    title: DANE für SMTP vorhanden
    text: >-
      Für die Domain {domain} sind DANE-Einträge für den SMTP-Übertragungsweg hinterlegt.
