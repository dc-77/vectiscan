id: cert_expiring_later
title: TLS-Zertifikat läuft in den nächsten Wochen ab
family: cert_expiring
category: D
scale: hygiene
level: mittel
group_by: fqdn
scope: tls
applicable_when: null
# S6b-2 (E2): 15 bis 30 Tage Restlaufzeit sind mittelfristig; bis 14 Tage gilt cert_expiring.
when: tls.cert is not None and tls.cert.expired is not True and tls.cert.days_left > CERT_SOON_DAYS and tls.cert.days_left <= CERT_EXPIRING_DAYS
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [testssl]
kind: check
bundle: cert_health
# S6b-3 (spec/10 R18, E12): absolutes Datum statt relativer Frist.
affected_template: "{target} ({validity_text})"
evidence: [tls]
references: [CWE-298]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Entscheidung DC E2 (spec/09 Teil 7)
  start_level: mittel
  deviation: >-
    Restlaufzeit von 15 bis 30 Tagen: Hygiene mittel und mittelfristig; bis 14 Tage Hygiene
    hoch (cert_expiring), bis sieben Tage Unverzueglich.
texts:
  short: "Zertifikat läuft in den nächsten Wochen ab"
  plan:
    lever: "Erneuerung der Zertifikate einplanen"
    effect: "Verhindert den Ausfall des Dienstes zum Ablaufdatum des Zertifikats"
  observation:
    - when: days_until(tls.cert.not_after, report_date) >= 0
      quantor: eines
      text: >-
        Für {n:den Dienst|die Dienste} {group} läuft das eingesetzte TLS-Zertifikat in den nächsten Wochen ab:
        {affected}.
    - when: days_until(tls.cert.not_after, report_date) < 0
      quantor: eines
      text: >-
        Für {n:den Dienst|die Dienste} {group} lief das eingesetzte TLS-Zertifikat nach dem Scan ab: {affected}.
        Ist es inzwischen nicht erneuert, sehen alle Nutzer eine Vertrauenswarnung.
    # S6b-4 (spec/11 T14, R18): zwischen Scantag und Berichtsdatum faellt die Restlaufzeit unter
    # die Grenze fuer eine kurzfristige Erneuerung (huendgen: am Scantag 17, am Berichtsdatum
    # hoechstens 14 Tage).
    - when: days_until(tls.cert.not_after, report_date) >= 0 and days_until(tls.cert.not_after, report_date) <= CERT_SOON_DAYS
      quantor: eines
      text: >-
        Am Berichtsdatum liegt der Ablauf höchstens zwei Wochen entfernt; die Dringlichkeit dieses
        Befunds bezieht sich auf den Scantag.
    - when: tls.cert.renewal is not None and len(tls.cert.renewal.recent_leads) > 0
      quantor: eines
      text: >-
        Laut den öffentlichen Zertifikatsprotokollen (CT-Logs) wird dieses Zertifikat regelmäßig
        erneuert; das zuletzt beobachtete Muster und das danach erwartete Datum stehen im Nachweis.
  meaning: >-
    Läuft das Zertifikat ab, ohne dass eine Erneuerung vorbereitet ist, sehen alle Nutzer eine
    Vertrauenswarnung oder einen Verbindungsabbruch. Mit dem verbleibenden Vorlauf lässt sich die
    Erneuerung planmäßig erledigen.
  recommendation:
    - stage: in_kuerze
      when: days_until(tls.cert.not_after, report_date) <= CERT_SOON_DAYS
      quantor: eines
      text: >-
        Prüfen, ob die Erneuerung inzwischen erfolgt ist, und sie andernfalls vor dem Ablaufdatum
        durchführen.
    - stage: mittelfristig
      when: days_until(tls.cert.not_after, report_date) > CERT_SOON_DAYS
      quantor: eines
      text: >-
        Die Erneuerung des Zertifikats vor dem Ablaufdatum einplanen und durchführen.
    - stage: strategisch
      when: tls.cert.renewal is None or len(tls.cert.renewal.recent_leads) == 0
      text: >-
        Eine automatisierte Erneuerung mit ausreichendem zeitlichem Vorlauf einrichten.
  verify: >-
    Verbindung zum Dienst mit einem TLS-Client aufbauen und das Ablaufdatum des präsentierten
    Zertifikats prüfen; erwartet wird ein neues Zertifikat mit ausreichendem Vorlauf.
