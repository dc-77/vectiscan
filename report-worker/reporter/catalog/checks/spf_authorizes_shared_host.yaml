id: spf_authorizes_shared_host
title: SPF gibt geteilten Server frei
family: spf_shared_host
category: C
scale: hygiene
level: mittel
group_by: domain
scope: dns
applicable_when: dns.spf is not None
when: len(spf_shared_ips(dns, hosts)) > 0
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: null
affected_template: "{domain} ({spf_shared_hosts})"
evidence: [dns]
# S6b-4 (spec/11 T9): Nachweis mit Mechanismus, Aufloesung und Zahl weiterer Domains.
evidence_detail: dns.spf_shared
references: [CWE-290]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: S6b-3 (spec/10 R19)
  start_level: mittel
  deviation: null
texts:
  short: "SPF gibt geteilten Server frei"
  plan:
    lever: "Absenderfreigabe auf eigene oder vertraglich gebundene Systeme beschränken"
    effect: "Verhindert, dass andere Anwendungen desselben Servers im Namen der Domain senden"
  # S6b-4 (spec/11 T9, E18): "auch für andere Kunden" ist aus den Rohdaten nicht ableitbar;
  # belegt sind die weiteren Domains auf dem Server laut Zertifikat oder Passivquelle.
  observation: >-
    Der SPF-Eintrag der Domain {domain} gibt einen Server als Absender frei, auf dem laut
    Zertifikat oder Passivquelle weitere Domains liegen: {affected}.
  meaning: >-
    Jede Anwendung auf diesem Server darf damit E-Mails im Namen der Domain versenden, auch
    die Anwendungen der weiteren Domains. Empfänger erkennen solche Mails an SPF nicht als
    gefälscht.
  recommendation:
    - stage: mittelfristig
      text: >-
        Prüfen, ob über den genannten Server tatsächlich E-Mails der Domain versendet werden;
        andernfalls den Mechanismus aus dem SPF-Eintrag entfernen.
    - stage: strategisch
      text: >-
        E-Mails der Domain nur über eigene oder vertraglich gebundene Versanddienste senden
        und diese im SPF-Eintrag gezielt freigeben.
  verify: >-
    SPF-Eintrag der Domain erneut abfragen; erwartet wird, dass kein Server mit weiteren
    Domains mehr freigegeben ist oder der Versand über ihn belegt ist.
