id: http_alt_port
title: Webdienst auf unüblichem Port erreichbar
family: http_alt_port
category: A
scale: hygiene
level: niedrig
group_by: host
scope: service
applicable_when: null
# S6b-3 (spec/10 R9): ein nmap-Tabellentreffer ohne Kennung ("https-alt?") ist kein erkannter
# Webdienst; er steht unter service_unidentified.
when: startswith(service.service, "http") and service.unidentified is not True and service.port not in WEB_PORTS and service.port not in ADMIN_PORTS and not matches(service.product, ADMIN_PRODUCTS) and not is_cdn(host, services)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: windows_edge_exposure
affected_template: "{host_ip}:{port} ({kennung_label})"
evidence: [service]
references: [CWE-16, OWASP2025-A05]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: neu (spec/06 Abschnitt 4)
  start_level: niedrig
  deviation: null
texts:
  short: "zusätzlicher Webport"
  plan:
    lever: "Zweck zusätzlicher Webports klären"
    effect: "Verkleinert die Angriffsfläche um nicht benötigte Webdienste"
  # S6b-3 (spec/10 R9): nennt der Dienst sich selbst (Produkt, Titel, Stream-Kopf), steht die
  # Kennung im Befund; "Zweck nicht erkennbar" nur ohne jede Kennung.
  observation:
    - text: >-
        {n:Der Host|Die Hosts} {group} {n:beantwortet|beantworten} Anfragen an einen Webdienst auf einem Port außerhalb der
        üblichen Web- und Verwaltungsports: {affected}.
    - when: service.kennung is None
      quantor: eines
      text: >-
        Der Zweck dieses Dienstes ist von außen nicht erkennbar.
    # S6b-4 (spec/11 Teil 3 HE): auf einer Mandantenplattform gehoert der Port dem Anbieter
    # (huendgen 8443 mit Zertifikat der Plattform); "Port schliessen" laeuft dort ins Leere.
    - when: host.shared is not None and host.shared.kind == "platform"
      quantor: eines
      text: >-
        Die Adresse gehört zur Plattform eines Anbieters; den Port stellt der Plattformbetreiber
        bereit.
  meaning: >-
    Ein Webdienst auf einem unüblichen Port bleibt bei einer Prüfung der Standardports leicht
    unbemerkt und vergrößert die Angriffsfläche um eine Anwendung, deren Pflegezustand von
    außen nicht erkennbar ist.
  recommendation:
    - stage: in_kuerze
      when: service.kennung is None and (host.shared is None or host.shared.kind != "platform")
      quantor: eines
      text: >-
        Klären, welche Anwendung den Dienst bereitstellt und ob ein Zugriff aus dem gesamten
        Internet dafür erforderlich ist.
      effect: "Klärt, ob der Dienst aus dem Internet erreichbar sein muss"
    - stage: in_kuerze
      when: service.kennung is not None and (host.shared is None or host.shared.kind != "platform")
      quantor: eines
      text: >-
        Prüfen, ob die genannte Anwendung aus dem gesamten Internet erreichbar sein muss.
      effect: "Klärt, ob der Dienst aus dem Internet erreichbar sein muss"
    - stage: mittelfristig
      when: host.shared is None or host.shared.kind != "platform"
      quantor: eines
      text: >-
        Nicht mehr benötigte Dienste abschalten und den zugehörigen Port schließen;
        weiterhin benötigte Dienste auf feste Quellnetze beschränken.
    - stage: mittelfristig
      when: host.shared is not None and host.shared.kind == "platform"
      quantor: eines
      text: >-
        Beim Plattformbetreiber erfragen, wozu der Port dient und ob er für die eigene Website
        erreichbar sein muss.
      effect: "Klärt, ob der Plattformdienst für die eigene Website nötig ist"
  verify:
    - when: host.shared is None or host.shared.kind != "platform"
      quantor: eines
      text: >-
        Portscan des Hosts von einer externen Adresse wiederholen; erwartet wird, dass der Port nur
        noch für berechtigte Quellnetze erreichbar oder vollständig geschlossen ist.
    - when: host.shared is not None and host.shared.kind == "platform"
      quantor: eines
      text: >-
        Die Auskunft des Plattformbetreibers zum Zweck des Ports festhalten; erwartet wird eine
        Aussage, ob die eigene Website den Port nutzt.
