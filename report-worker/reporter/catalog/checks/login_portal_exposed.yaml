id: login_portal_exposed
title: Anmeldeportal aus dem Internet erreichbar
family: login_portal_exposed
category: A
scale: hygiene
level: mittel
group_by: fqdn
scope: fqdn
applicable_when: null
when: fqdn.http_status == 200 and matches(fqdn.title, LOGIN_TITLES) and not matches(fqdn.title, ADMIN_TITLES)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [web_probe]
kind: check
bundle: null
affected_template: "{fqdn} ({title})"
evidence: [fqdn]
references: [CWE-307, CWE-521]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-LOGIN-PORTAL
  start_level: mittel
  deviation: >-
    Das Portal ist gewollt erreichbar; die Einstufung Hygiene mittel gilt der fehlenden
    zusaetzlichen Absicherung, nicht der Erreichbarkeit selbst (catalog_sim R-LOGIN-PORTAL).
texts:
  plan:
    # S6b-4 (spec/11 T10): ob ein zweiter Faktor aktiv ist, ist von außen nicht feststellbar.
    lever: "Zweite Anmeldestufe an Anmeldeportalen prüfen"
    effect: "Erschwert die Übernahme von Konten durch Rateangriffe"
  observation: >-
    {n:Die Webseite|Die Webseiten} {group} {n:zeigt|zeigen} ein Anmeldeportal, das aus dem gesamten Internet erreichbar ist:
    {affected}. Die Erreichbarkeit selbst ist beabsichtigt, wenn das Portal für den externen
    Zugriff vorgesehen ist.
  meaning: >-
    Ein öffentlich erreichbares Anmeldeportal ist ein häufiges Ziel für automatisierte
    Anmeldeversuche mit gestohlenen oder erratenen Zugangsdaten. Ohne zusätzliche Absicherung
    genügt ein einzelnes bekanntes Passwort für den Zugriff. Ob ein zweiter Faktor aktiv ist, ist
    von außen nicht feststellbar.
  recommendation:
    - stage: in_kuerze
      text: >-
        Prüfen, ob die Anmeldung am Portal einen zusätzlichen Faktor verlangt, etwa eine
        Authentifizierungs-App oder ein Einmalkennwort, und ihn andernfalls ergänzen.
    - stage: in_kuerze
      text: >-
        Zugriff auf bekannte Quellnetze beschränken, soweit die Nutzung des Portals das
        zulässt.
    - stage: mittelfristig
      text: >-
        Softwarestand des Portals regelmäßig gegen die Sicherheitshinweise des Herstellers
        prüfen und zeitnah einspielen.
  verify: >-
    Anmeldeversuch mit einem falschen Kennwort durchführen; erwartet wird eine Sperre oder
    Verzögerung nach mehreren Fehlversuchen sowie die Abfrage des zusätzlichen Faktors.
