id: dns_zone_transfer
title: DNS-Zonentransfer möglich
family: dns_axfr
category: C
scale: exposure
level: erhoeht
group_by: domain
scope: dns
applicable_when: null
when: dns.zone_transfer is not None and dns.zone_transfer.allowed is True
positive_when: dns.zone_transfer is not None and dns.zone_transfer.allowed is False
not_testable_when:
  - when: dns.zone_transfer is None or dns.zone_transfer.allowed is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: dns_integrity
affected_template: "{domain} ({ns})"
evidence: [dns]
references: [CWE-200, RFC-5936]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-DNS-AXFR
  start_level: erhoeht
  deviation: null
texts:
  short: "Abruf der gesamten Zone möglich"
  plan:
    lever: "Zonentransfer auf die eigenen Nameserver beschränken"
    effect: "Verbirgt den vollständigen Namensbestand der Domain"
  observation: >-
    Für {affected} lässt ein Nameserver der Domain {domain} einen vollständigen Zonentransfer
    zu. Damit kann jede anfragende Gegenstelle die komplette Liste der Hostnamen der Zone auf
    einmal abrufen.
  meaning: >-
    Ein Zonentransfer liefert alle in der Zone hinterlegten Einträge, auch solche ohne eigenen
    Verweis von außen. Das erleichtert die Aufklärung der internen Struktur und die Suche nach
    weniger beachteten Hostnamen für einen weiteren Angriff.
  recommendation:
    - stage: unverzueglich
      text: >-
        Zonentransfer auf den Nameservern auf die berechtigten sekundären Nameserver
        beschränken und für alle anderen Anfragenden verweigern.
  verify: >-
    Zonentransfer für die Domain {domain} gegen die genannten Nameserver von einer externen
    Adresse aus anfordern; erwartet wird eine Verweigerung.
  positive:
    title: Zonentransfer abgewiesen
    text: >-
      Für die Domain {domain} weisen die Nameserver einen vollständigen Zonentransfer ab.
