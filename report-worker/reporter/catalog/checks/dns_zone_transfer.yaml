id: dns_zone_transfer
title: DNS-Zonentransfer moeglich
family: dns_axfr
category: C
scale: exposure
level: erhoeht
group_by: domain
scope: dns
applicable_when: null
when: dns.zone_transfer is not None and dns.zone_transfer.allowed is True
positive_when: dns.zone_transfer is not None and dns.zone_transfer.allowed is False
not_testable_when:
  - when: dns.zone_transfer is None or dns.zone_transfer.allowed is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: null
affected_template: "{domain} ({ns})"
evidence: [dns]
references: [CWE-200, RFC-5936]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-DNS-AXFR
  start_level: erhoeht
  deviation: null
texts:
  observation: >-
    Fuer {affected} laesst ein Nameserver der Domain {domain} einen vollstaendigen Zonentransfer
    zu. Damit kann jede anfragende Gegenstelle die komplette Liste der Hostnamen der Zone auf
    einmal abrufen.
  meaning: >-
    Ein Zonentransfer liefert alle in der Zone hinterlegten Eintraege, auch solche ohne eigenen
    Verweis von aussen. Das erleichtert die Aufklaerung der internen Struktur und die Suche nach
    weniger beachteten Hostnamen fuer einen weiteren Angriff.
  recommendation:
    - stage: unverzueglich
      text: >-
        Zonentransfer auf den Nameservern auf die berechtigten sekundaeren Nameserver
        beschraenken und fuer alle anderen Anfragenden verweigern.
  verify: >-
    Zonentransfer fuer die Domain {domain} gegen die genannten Nameserver von einer externen
    Adresse aus anfordern; erwartet wird eine Verweigerung.
  positive:
    title: Zonentransfer abgewiesen
    text: >-
      Fuer die Domain {domain} weisen die Nameserver einen vollstaendigen Zonentransfer ab.
