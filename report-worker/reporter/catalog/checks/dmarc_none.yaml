id: dmarc_none
title: DMARC-Richtlinie ohne Durchsetzung
family: dmarc_none
category: C
scale: hygiene
level: mittel
group_by: domain
scope: dns
applicable_when: len(dns.mx) > 0 and dns.dmarc is not None and dns.dmarc.present is True
when: dns.dmarc.p == "none"
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: mail_policy
affected_template: "{domain} (p={dmarc_p})"
evidence: [dns]
references: [CWE-290, RFC-7489]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DNS-007
  start_level: LOW
  deviation: >-
    Der Prototyp stuft eine DMARC-Richtlinie ohne Durchsetzung (p=none) als Hygiene mittel ein,
    weil sie zwar Auswertung ueber Berichte ermoeglicht, aber keine Zustellentscheidung
    erzwingt.
texts:
  short: "DMARC ohne Durchsetzung"
  plan:
    lever: "DMARC-Richtlinie durchsetzen"
    effect: "Weist gefälschte E-Mails im Namen der Domain ab"
  observation: >-
    Die DMARC-Richtlinie der Domain {domain} ist auf reine Beobachtung gesetzt: {affected}.
    E-Mails, die SPF oder DKIM nicht bestehen, werden dadurch nicht zurückgewiesen oder
    unter Quarantäne gestellt.
  meaning:
    - text: >-
        Eine DMARC-Richtlinie ohne Durchsetzung verändert die Zustellung nicht. Gefälschte
        E-Mails im Namen der Domain kommen weiterhin beim Empfänger an.
    - when: len(dns.dmarc.rua) > 0
      text: >-
        Die Berichte über fehlgeschlagene Prüfungen gehen an die hinterlegte Meldeadresse.
    - when: len(dns.dmarc.rua) == 0
      text: >-
        Eine Meldeadresse ist nicht hinterlegt; Berichte über fehlgeschlagene Prüfungen
        erreichen Sie deshalb nicht.
  recommendation:
    - stage: in_kuerze
      when: len(dns.dmarc.rua) > 0
      text: >-
        Die Berichte der aktuellen Richtlinie auswerten und alle legitimen Versandquellen der
        Domain bestätigen.
    - stage: in_kuerze
      when: len(dns.dmarc.rua) == 0
      text: >-
        Eine Meldeadresse (rua) in den DMARC-Eintrag aufnehmen, die Berichte auswerten und alle
        legitimen Versandquellen der Domain bestätigen.
    - stage: mittelfristig
      text: >-
        Die Richtlinie auf Quarantäne und danach auf Zurückweisung anheben, sobald alle
        legitimen Versender erfasst sind.
  verify: >-
    DNS-Abfrage des TXT-Eintrags _dmarc.{domain}; erwartet wird eine Richtlinie p, die nicht
    auf reine Beobachtung gesetzt ist.
