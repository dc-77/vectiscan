id: admin_service_exposed
title: Verwaltungsoberfläche aus dem Internet erreichbar
family: admin_service_exposed
category: A
scale: exposure
level: erhoeht
group_by: host
scope: service
applicable_when: null
when: (service.port in ADMIN_PORTS or matches(service.product, ADMIN_PRODUCTS)) and not is_cdn(host, services)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: null
affected_template: "{host_ip}:{port} ({product_or_service})"
evidence: [service]
references: [CWE-284, CISA-KEV]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-ADMIN-EXPOSED
  start_level: erhoeht
  deviation: null
texts:
  observation: >-
    Der Host {group} bietet eine Verwaltungs- oder Firewall-Oberfläche an, die aus dem gesamten
    Internet erreichbar ist: {affected}. Eine Zugriffsbeschränkung auf bestimmte Quellnetze ist
    von außen nicht erkennbar.
  meaning: >-
    Verwaltungsoberflächen sind ein hochwertiges Ziel: Eine Übernahme betrifft den gesamten
    Anschluss inklusive der dahinter liegenden Systeme. Angreifer können Anmeldedaten erraten oder
    bekannte Schwachstellen der Verwaltungssoftware ausnutzen.
  recommendation:
    - stage: unverzueglich
      text: >-
        Zugriff auf die Verwaltungsoberfläche auf die benötigten Quellnetze beschränken, etwa
        über die Firewall des Hosters oder eine Zugriffsliste am Dienst selbst.
    - stage: in_kuerze
      text: >-
        Mehrfaktor-Anmeldung für die Verwaltungsoberfläche aktivieren und Standardkonten
        deaktivieren oder umbenennen.
    - stage: mittelfristig
      text: >-
        Softwarestand der Verwaltungsoberfläche gegen die Sicherheitshinweise des Herstellers
        abgleichen und Anmeldeversuche überwachen.
  verify: >-
    Verbindungsversuch auf den betroffenen Port von einer externen Adresse außerhalb der
    freigegebenen Quellnetze; erwartet wird eine Ablehnung durch die Zugriffsbeschränkung.
