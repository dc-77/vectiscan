id: admin_service_exposed
title: Verwaltungsoberfläche aus dem Internet erreichbar
family: admin_service_exposed
category: A
scale: exposure
level: kritisch
group_by: host
scope: service
applicable_when: null
when: admin_fp(service) and service.fp_login is True and (host is None or host.shared is None) and not is_cdn(host, services)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: admin_access
affected_template: "{host_ip}:{port} ({admin_label})"
evidence: [service]
references: [CWE-284, CISA-KEV]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-ADMIN-EXPOSED
  start_level: erhoeht
  deviation: >-
    Entscheidung DC E1 (spec/09): eine Verwaltungsoberflaeche mit belegter Anmeldung ohne
    vorgelagerten Schutz auf einem System des Kunden ist Exposition kritisch. Ohne
    Fingerabdruck oder ohne belegte Anmeldung gilt admin_service_unconfirmed, auf einem
    geteilten System des Hosters admin_panel_hoster.
texts:
  short: "Verwaltungsoberfläche mit Anmeldung"
  plan:
    lever: "Verwaltungsoberflächen vom Internet trennen"
    effect: "Entzieht Angreifern den direkten Zugang zur Verwaltung der Systeme"
  observation: >-
    {n:Der Host|Die Hosts} {group} {n:bietet|bieten} eine Verwaltungsoberfläche mit Anmeldung an, die aus dem gesamten
    Internet erreichbar ist: {affected}. Die Antwort des Dienstes nennt die Verwaltungssoftware
    und verlangt eine Anmeldung; eine Zugriffsbeschränkung auf bestimmte Quellnetze war von
    außen nicht erkennbar.
  meaning: >-
    Verwaltungsoberflächen sind ein hochwertiges Ziel: Eine Übernahme betrifft den gesamten
    Anschluss inklusive der dahinter liegenden Systeme. Angreifer können Anmeldedaten erraten oder
    bekannte Schwachstellen der Verwaltungssoftware ausnutzen.
  recommendation:
    - stage: unverzueglich
      text: >-
        Zugriff auf die Verwaltungsoberfläche auf die benötigten Quellnetze beschränken, etwa
        über die Firewall des Hosters oder eine Zugriffsliste am Dienst selbst.
    - stage: in_kuerze
      text: >-
        Mehrfaktor-Anmeldung für die Verwaltungsoberfläche aktivieren und Standardkonten
        deaktivieren oder umbenennen.
    - stage: mittelfristig
      text: >-
        Softwarestand der Verwaltungsoberfläche gegen die Sicherheitshinweise des Herstellers
        abgleichen und Anmeldeversuche überwachen.
  verify: >-
    Verbindungsversuch auf den betroffenen Port von einer externen Adresse außerhalb der
    freigegebenen Quellnetze; erwartet wird eine Ablehnung durch die Zugriffsbeschränkung.
