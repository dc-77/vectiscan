id: ftp_plaintext
title: FTP-Dienst ohne erzwungene Transportverschlüsselung
family: ftp_exposed
category: A
scale: exposure
level: erhoeht
group_by: host
scope: service
applicable_when: has_port(services, 21)
item_when: service.port == 21
# S6b-2 (spec/08 Punkt 4): ein Befund braucht den Beleg, dass eine Anmeldung ohne TLS
# moeglich ist. Ohne Beleg ist die Pruefung nicht moeglich; der Port steht dann bei
# legacy_protocols_present mit dem Hinweis, dass die Erzwingung offen ist.
when: service.tls_required is False and service.tunnel_ssl is False
positive_when: service.tls_required is True or service.tunnel_ssl is True
not_testable_when:
  - when: service.tls_required is None and service.tunnel_ssl is False
    reason_code: ftp_tls_unknown
    context: item
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: plaintext_services
affected_template: "{host_ip}:{port} (FTP ohne TLS-Zwang)"
evidence: [service]
references: [CWE-319, CWE-522, OWASP2025-A02]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-FTP-PLAIN
  start_level: erhoeht
  deviation: >-
    FTP hat einen legitimen Zweck, daher gilt die Expositionsskala erhoeht statt kritisch. Nach
    der Festlegung vom 19.09.2026 gilt ein FTP-Dienst ohne erzwungene Transportverschluesselung
    unabhaengig von einer zusaetzlich moeglichen impliziten TLS-Verbindung als Klartext-Befund,
    weil die Anmeldung ohne diesen Zwang unverschluesselt erfolgen kann.
texts:
  short: "FTP ohne TLS-Zwang"
  plan:
    lever: "TLS für FTP erzwingen"
    effect: "Schützt Zugangsdaten und Dateien auf dem Übertragungsweg"
  observation: >-
    Auf {group} nimmt der FTP-Dienst Anmeldungen entgegen, ohne eine Transportverschlüsselung
    zu erzwingen: {affected}.
  meaning: >-
    Ohne erzwungenes TLS überträgt der FTP-Dienst Anmeldedaten und Dateiinhalte im Klartext
    über das Netz. Jeder Mitleser auf dem Übertragungsweg kann Zugangsdaten abgreifen und für
    weitere Zugriffe auf den Dienst oder wiederverwendete Konten nutzen.
  recommendation:
    - stage: unverzueglich
      text: >-
        Auf dem FTP-Dienst die Option für eine erzwungene Transportverschlüsselung aktivieren,
        sodass eine Anmeldung ohne aufgebautes TLS abgelehnt wird.
    - stage: in_kuerze
      text: >-
        Zugangsdaten des FTP-Dienstes rotieren und die Zugriffsprotokolle auf unverschlüsselte
        Anmeldeversuche prüfen.
    - stage: mittelfristig
      text: >-
        Prüfen, ob der Dateiaustausch stattdessen über ein Übertragungsprotokoll mit
        eingebauter Verschlüsselung erfolgen kann, und den Klartextzugang danach abschalten.
  verify: >-
    Anmeldung am FTP-Dienst von außen versuchen, bevor eine Transportverschlüsselung
    aufgebaut ist; erwartet wird die Ablehnung dieser unverschlüsselten Anmeldung.
  positive:
    title: FTP erzwingt TLS vor der Anmeldung
    text: >-
      Auf {group} lehnt der FTP-Dienst eine Anmeldung ohne aufgebaute Transportverschlüsselung
      ab.
