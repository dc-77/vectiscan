id: dnssec_missing
title: DNS-Zone ohne DNSSEC-Signatur
family: dnssec_missing
category: E
scale: hygiene
level: niedrig
group_by: domain
scope: dns
applicable_when: null
when: dns.dnssec is not None and dns.dnssec.signed is False
positive_when: dns.dnssec is not None and dns.dnssec.signed is True
not_testable_when:
  - when: dns.dnssec is None or dns.dnssec.signed is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [dns_security]
kind: check
bundle: dns_hygiene
affected_template: "{domain}"
evidence: [dns]
references: [CWE-345, RFC-4033]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DNS-001
  start_level: LOW
  deviation: null
texts:
  observation: >-
    Fuer {affected} ist die DNS-Zone nicht mit einer DNSSEC-Signatur versehen. Fuer die Domain
    {domain} lassen sich Antworten auf DNS-Abfragen damit nicht kryptografisch auf Echtheit
    pruefen.
  meaning: >-
    Ohne DNSSEC kann ein Angreifer, der den Antwortweg einer DNS-Abfrage beeinflusst, gefaelschte
    DNS-Antworten unterschieben, ohne dass ein anfragender Resolver dies erkennt. Betroffen sind
    vor allem die Zustellung von E-Mails und die Aufloesung von Hostnamen in fremden Netzen.
  recommendation:
    - stage: strategisch
      text: >-
        DNSSEC fuer die Zone aktivieren und den Signaturschluessel beim Registrar als DS-Eintrag
        hinterlegen, damit die Signaturkette bis zur Root nachvollziehbar ist.
  verify: >-
    DNS-Abfrage der SOA mit aktivierter DNSSEC-Option fuer die Domain {domain}; erwartet wird ein
    RRSIG-Eintrag in der Antwort.
  positive:
    title: DNSSEC signiert
    text: >-
      Fuer die Domain {domain} ist die DNS-Zone mit DNSSEC signiert.
