id: wordpress_plugin_vulnerable
# S6b-4 (spec/11 T12): Mehrzahl nach der Zahl der Erweiterungen (dortmund-beach: vier).
title: "{m:WordPress-Erweiterung|WordPress-Erweiterungen} mit bekannten Schwachstellen"
family: wordpress_plugin_vulnerable
category: B
scale: exposure
level: erhoeht
group_by: host
scope: software
applicable_when: null
item_when: null
when: software.kind in ["plugin", "theme"] and software.vulnerabilities_count > 0
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [wpscan]
kind: check
bundle: null
# S6 (spec/08 Punkt 19): "(1 bekannte Schwachstellen)" ging nicht; die Zahl
# steht deshalb hinten und der Satzbau bleibt fuer jede Anzahl richtig.
affected_template: "{host_ip}: {product} {version} (laut wpscan bekannte Schwachstellen: {vulnerabilities_count})"
evidence: [software]
references: [CWE-1395, OWASP2025-A06]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-WP-001
  start_level: MEDIUM
  deviation: >-
    SP-WP-001 stuft die Sammelklasse WordPress-Plugin- und Theme-Schwachstellen auf MEDIUM ein;
    der Prototyp (catalog_sim) fuehrt oeffentlich ausnutzbare Plugin-Luecken als Exposition
    erhoeht, weil die Schwachstelle ueber die Anwendung von aussen erreichbar ist. Die Anzahl
    bekannter Schwachstellen kommt ausschliesslich aus der Werkzeugausgabe; das Label nennt immer
    Produkt und Version, nie nur eine Zahl.
texts:
  plan:
    lever: "Verwundbare WordPress-Erweiterungen aktualisieren"
    effect: "Schließt bekannte Lücken in Erweiterungen"
  observation: >-
    Auf {group} {m:ist eine WordPress-Erweiterung|sind WordPress-Erweiterungen} mit bekannten
    Schwachstellen im Einsatz: {affected}.
  meaning: >-
    Bekannte Schwachstellen in Plugins oder Themes sind öffentlich dokumentiert und lassen sich
    ohne Zugriff auf den Server nachvollziehen. Eine veraltete Erweiterung bleibt so lange
    angreifbar, bis die fehlerbereinigte Version eingespielt ist.
  recommendation:
    # S6b-4 (spec/11 T12): die Zielversion laut wpscan steht in der Empfehlung.
    # S6b-4n (spec/11 N9): "fehlerbereinigt ab" und "neueste laut wpscan" getrennt, mit Produktnamen.
    - stage: unverzueglich
      when: software.latest_version is not None
      quantor: eines
      text: >-
        Erweiterungen auf eine fehlerbereinigte Version aktualisieren: {target_versions}; lässt
        sich das nicht sofort umsetzen, die Erweiterung deaktivieren.
    - stage: unverzueglich
      when: software.latest_version is None
      quantor: eines
      text: >-
        Erweiterung auf die vom Hersteller freigegebene, fehlerbereinigte Version aktualisieren;
        lässt sich das nicht sofort umsetzen, die Erweiterung deaktivieren.
    - stage: in_kuerze
      text: >-
        Prüfen, ob die Erweiterung für den Betrieb noch benötigt wird, und nicht mehr genutzte
        Erweiterungen entfernen.
  verify: >-
    Versionsstand der Erweiterung im Adminbereich prüfen und mit dem Eintrag im Plugin-
    beziehungsweise Theme-Verzeichnis des Herstellers abgleichen; erwartet wird die aktuelle,
    fehlerbereinigte Version ohne offene Schwachstellen.
