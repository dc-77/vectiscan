id: csrf_token_missing
title: Formular ohne Anti-CSRF-Token
family: csrf_token_missing
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: http.alerts
applicable_when: null
# S6b-2 (spec/09 Q14): nur Meldungen mit Konfidenz High tragen eine Regel; darunter
# stehen sie als Werkzeugmeldung im Anhang (web_vulnerability_reported).
when: '(zap_match(alert, ZAP_CSRF)) and alert.confidence == "High"'
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [zap]
kind: check
bundle: web_header_hygiene
affected_template: "{fqdn} ({url_path})"
evidence: [http]
references: [CWE-352, OWASP2025-A01]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-CSRF-001
  start_level: INFO
  deviation: >-
    SP-CSRF-001 bis 003 unterscheiden nach Zustandsaenderung und Anmeldung, was von aussen nicht
    bestimmbar ist; die Simulation fuehrt den Werkzeugbefund als Hygiene niedrig.
texts:
  short: "Formulare ohne Anti-CSRF-Token"
  plan:
    lever: "Formulare mit Anti-CSRF-Token absichern"
    effect: "Verhindert, dass fremde Seiten Aktionen im Namen angemeldeter Nutzer auslösen"
  observation: >-
    Die passive Webanalyse hat auf {group} Formulare ohne Anti-CSRF-Token gefunden: {affected}.
  meaning: >-
    Für sich genommen keine ausnutzbare Schwachstelle. Fehlt das Token bei einem Formular, das
    Zustand verändert, kann eine fremde Seite Aktionen im Namen eines angemeldeten Nutzers
    auslösen. Bei Anmeldeportalen zählt die Tiefe der Verteidigung.
  recommendation:
    - stage: mittelfristig
      text: >-
        Anti-CSRF-Token in Formularen, die Zustand verändern, und das SameSite-Attribut für
        Sitzungs-Cookies setzen (Herstellerkonfiguration prüfen).
  verify: >-
    Quelltext des betroffenen Formulars prüfen; erwartet wird ein verstecktes Feld mit einem
    sitzungsgebundenen Token.
