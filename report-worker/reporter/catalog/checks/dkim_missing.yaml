id: dkim_missing
title: DKIM-Signatur fehlt
family: dkim_missing
category: C
scale: hygiene
level: mittel
group_by: domain
scope: dns
applicable_when: len(dns.mx) > 0
when: dns.dkim is not None and dns.dkim.present is False
positive_when: dns.dkim is not None and dns.dkim.present is True
not_testable_when:
  - when: dns.dkim is None or dns.dkim.present is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: mail_records
affected_template: "{domain}"
evidence: [dns]
references: [CWE-290, RFC-6376]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DNS-008
  start_level: LOW
  deviation: >-
    SP-DNS-008 fuehrt die fehlende DKIM-Signatur als LOW; catalog_sim ordnet sie als Hygiene mittel
    ein, weil DKIM neben SPF die zweite Saeule der Absender-Authentizitaet ist und ohne sie
    Weiterleitungen die SPF-Pruefung beim Empfaenger regelmaessig scheitern lassen.
texts:
  observation: >-
    Für {affected} ist im DNS keine DKIM-Signatur nachweisbar. Für ausgehende E-Mails der
    Domain {domain} fehlt damit ein Selektor, über den Empfängersysteme die Signatur prüfen
    könnten.
  meaning: >-
    Ohne DKIM lassen sich E-Mails der Domain nicht kryptografisch dem versendenden System
    zuordnen. Weiterleitende Mailserver verändern häufig den Umschlagabsender, wodurch die
    SPF-Prüfung beim Empfänger allein nicht mehr ausreicht. DKIM ergänzt SPF um eine von
    Weiterleitungen unabhängige Prüfung.
  recommendation:
    - stage: in_kuerze
      text: >-
        Auf dem Mailserver DKIM für die Domain aktivieren, einen Selektor wählen und den
        öffentlichen Schlüssel als TXT-Eintrag veröffentlichen.
    - stage: mittelfristig
      text: >-
        Alle Versandwege der Domain, einschließlich Marketing- und Support-Systemen, in die
        DKIM-Signierung einbeziehen und die Signaturen regelmäßig prüfen.
  verify: >-
    DNS-Abfrage des TXT-Eintrags am Selektor-Namen unter _domainkey.{domain}; erwartet wird ein
    Eintrag, der mit v=DKIM1 beginnt und einen öffentlichen Schlüssel enthält.
  positive:
    title: DKIM vorhanden
    text: >-
      Für die Domain {domain} ist eine DKIM-Signatur veröffentlicht.
