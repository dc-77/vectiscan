id: http_trace_enabled
title: HTTP-Methode TRACE aktiviert
family: http_trace_enabled
category: E
scale: hygiene
level: niedrig
group_by: host
scope: service
applicable_when: null
when: any_in(service.capabilities, ["METHOD:TRACE"])
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: banner_disclosure
affected_template: "{host_ip}:{port} (TRACE aktiv)"
evidence: [service]
references: [CWE-16, OWASP2025-A05]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-014
  start_level: niedrig
  deviation: null
texts:
  observation: >-
    Der Webdienst auf {group} akzeptiert die HTTP-Methode TRACE: {affected}. Der Server
    spiegelt dabei die gesendete Anfrage in der Antwort zurück.
  meaning: >-
    Eine aktivierte TRACE-Methode kann zusammen mit anderen Schwachstellen im Browser genutzt
    werden, um Inhalte auszulesen, die per Skript eigentlich nicht zugänglich sein sollten, etwa
    Cookies oder Autorisierungs-Header.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die HTTP-Methode TRACE auf dem Webserver deaktivieren; für den normalen Betrieb einer
        Website wird sie nicht benötigt.
  verify: >-
    Eine HTTP-Anfrage mit der Methode TRACE an den Dienst senden; erwartet wird eine Ablehnung
    mit dem Status 405 oder 501.
