id: dns_dangling_cname
title: Verwaister CNAME-Eintrag mit Übernahmerisiko
family: dns_dangling
category: C
scale: hygiene
level: mittel
group_by: domain
scope: dns.dangling_cnames
applicable_when: null
when: dangling.takeover_risk != "low"
positive_when: absent
not_testable_when: []
undetermined: not_testable
requires:
  tools: [dns_records]
kind: check
bundle: dns_integrity
affected_template: "{fqdn} (Ziel {cname_target})"
evidence: [dns]
references: [CWE-706]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-DNS-DANGLING
  start_level: mittel
  deviation: null
texts:
  observation: >-
    Für die Domain {domain} liegt mindestens ein CNAME-Eintrag vor, dessen Ziel nicht mehr
    unter eigener Kontrolle liegt oder nicht mehr antwortet: {affected}.
  meaning: >-
    Ein Angreifer, der den freien Zielnamen für sich registriert oder auf einem geteilten Dienst
    anlegt, kann Inhalte unter dem Namen der eigenen Domain ausliefern, Sitzungscookies der
    Domain lesen oder sich als vertrauenswürdiger Absender ausgeben.
  recommendation:
    - stage: in_kuerze
      text: >-
        Den CNAME-Eintrag auf ein tatsächlich genutztes Ziel umstellen oder vollständig aus
        der Zone entfernen, solange das ursprüngliche Ziel nicht mehr existiert.
    - stage: mittelfristig
      text: >-
        Bei der Außerbetriebnahme von Diensten den zugehörigen DNS-Eintrag im gleichen
        Arbeitsschritt entfernen, damit keine weiteren verwaisten Einträge entstehen.
  verify: >-
    DNS-Abfrage des betroffenen Hostnamens und Abgleich mit dem Ziel des CNAME-Eintrags;
    erwartet wird entweder ein auflösendes, selbst kontrolliertes Ziel oder das Entfernen des
    Eintrags.
  positive:
    title: Keine verwaisten CNAME-Einträge
    text: >-
      Für die Domain {domain} liegen keine verwaisten CNAME-Einträge vor.
