id: hsts_missing
title: HTTP Strict Transport Security nicht gesetzt
family: hsts_missing
category: D
scale: hygiene
level: mittel
group_by: fqdn
scope: http
applicable_when: has_port(services, 443)
item_when: null
when: http.hsts.present is False
positive_when: http.hsts.present is True
not_testable_when:
  - when: http.reachable is not True or http.hsts is None
    reason_code: unreachable
    context: item
undetermined: not_testable
requires:
  tools: [header_check]
kind: check
bundle: web_header_hygiene
affected_template: "{fqdn}"
evidence: [http]
references: [CWE-319, OWASP2025-A02]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-HDR-001, SP-HDR-002
  start_level: LOW
  deviation: >-
    SP-HDR-001 bewertet den fehlenden HSTS-Header als INFO, SP-HDR-002 als LOW. Der fehlende
    Downgrade-Schutz betrifft jeden Aufruf des Hosts ueber HTTP gleichermassen, daher fuehrt die
    Simulation die Pruefung als Hygiene mittel (catalog_sim, S2-Auftrag).
texts:
  short: "HSTS fehlt"
  plan:
    lever: "HTTP Strict Transport Security setzen"
    effect: "Verhindert unverschlüsselte Aufrufe der Webseite"
  observation: >-
    {n:Der Dienst|Die Dienste} {group} {n:liefert seine|liefern ihre} Antworten ohne den HTTP Strict Transport Security Header, der
    Browser dauerhaft auf die verschlüsselte Verbindung festlegt: {affected}.
  meaning: >-
    Ohne diesen Header kann ein erster Aufruf über HTTP unbemerkt abgefangen oder auf eine
    unverschlüsselte Verbindung heruntergestuft werden, bevor eine Weiterleitung auf HTTPS greift.
  recommendation:
    - stage: mittelfristig
      text: >-
        Den Header Strict-Transport-Security mit einer ausreichenden Gültigkeitsdauer setzen,
        sobald der Hostname dauerhaft über HTTPS erreichbar ist.
  verify: >-
    HTTP-Antwortheader der Startseite von außen abrufen; erwartet wird der gesetzte Header
    Strict-Transport-Security.
  positive:
    title: HTTP Strict Transport Security gesetzt
    text: >-
      {n:Der Dienst|Die Dienste} {group} {n:setzt|setzen} den Header Strict-Transport-Security und legt Browser damit auf die
      verschlüsselte Verbindung fest.
