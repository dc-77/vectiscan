id: db_exposed
title: Datenbankdienst aus dem Internet erreichbar
family: db_exposed
category: A
scale: exposure
level: kritisch
group_by: host
scope: service
applicable_when: null
when: service.port in DB_PORTS
positive_when: absent
not_testable_when: []
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: null
affected_template: "{host_ip}:{port} ({product})"
evidence: [service]
references: [CWE-284, CWE-200, OWASP2025-A05]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-DB-001
  start_level: HIGH
  deviation: >-
    Ein Datenbankdienst am oeffentlichen Interface ist nach der Expositionsskala des Prototyps
    kritisch (VS-001); SP-DB-002/003 stufen EOL- und Mehrfach-Hosts ohnehin CRITICAL ein.
texts:
  plan:
    lever: "Datenbankdienste vom Internet trennen"
    effect: "Entzieht Angreifern den direkten Zugriff auf die Datenbanken"
  observation: >-
    {n:Der Host|Die Hosts} {group} {n:beantwortet|beantworten} Verbindungen auf Datenbankports aus dem gesamten Internet:
    {affected}. Ein Datenbankdienst gehört nicht an das öffentliche Interface.
  meaning:
    - text: >-
        Ein von außen erreichbarer Datenbankdienst macht jede künftige Schwachstelle im
        Datenbankserver sofort ausnutzbar.
    - when: service.rejects_before_auth is not True
      quantor: eines
      text: >-
        Wo der Dienst eine Anmeldung von außen entgegennimmt, sind Passwort-Rateangriffe rund
        um die Uhr möglich: {affected}.
    - when: service.rejects_before_auth is True
      quantor: eines
      text: >-
        Laut Passivquelle weist der Dienst fremde Quellen vor der Anmeldung ab; die
        Erreichbarkeit des Ports bleibt trotzdem eine unnötige Angriffsfläche: {affected}.
  recommendation:
    - stage: unverzueglich
      text: >-
        Den externen Datenbankzugriff in der Verwaltung des Hosters oder in der Firewall deaktivieren.
        Falls eine externe Anwendung ihn benötigt, den Zugriff auf deren feste Quelladressen beschränken.
    - stage: in_kuerze
      text: >-
        Datenbank-Zugangsdaten rotieren und die Zugriffsprotokolle der letzten Monate auf fremde
        Anmeldeversuche prüfen.
    - stage: mittelfristig
      text: >-
        Administrativen Datenbankzugriff ausschließlich über einen SSH-Tunnel oder ein VPN zulassen.
  verify: >-
    Portscan der betroffenen Datenbankports von einer externen Adresse aus wiederholen; erwartet wird
    der Zustand gefiltert oder geschlossen.
  positive:
    title: Keine Datenbankdienste aus dem Internet erreichbar
    text: >-
      Auf {group} antwortet kein Datenbankdienst auf Verbindungen von außen.
