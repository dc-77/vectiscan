id: mail_plaintext
title: POP3 oder IMAP ohne erzwungene Transportverschlüsselung
family: mail_plaintext
category: A
scale: exposure
level: erhoeht
group_by: host
scope: service
applicable_when: has_port(services, 110) or has_port(services, 143)
item_when: service.port in [110, 143]
# S6b-2 (spec/08 Punkt 4): auch STARTTLS schuetzt nicht, wenn der Dienst die Anmeldung
# vorher annimmt (IMAP ohne LOGINDISABLED, POP3 mit USER oder SASL vor STLS).
when: service.tunnel_ssl is False and service.tls_required is not True and (service.starttls is False or service.tls_required is False)
positive_when: service.starttls is True or service.tls_required is True or service.tunnel_ssl is True
not_testable_when:
  - when: service.starttls is None and service.tls_required is None
    reason_code: mail_capabilities_unknown
    context: item
undetermined: not_testable
requires:
  tools: [nmap]
kind: check
bundle: plaintext_services
affected_template: "{host_ip}:{port} ({mail_name} {mail_login})"
evidence: [service]
references: [CWE-319, CWE-522, OWASP2025-A02]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-MAIL-PLAIN
  start_level: erhoeht
  deviation: >-
    POP3 und IMAP haben einen legitimen Zweck, daher gilt die Expositionsskala erhoeht statt
    kritisch. Nach der Festlegung vom 19.09.2026 ist ein Mailabrufdienst ohne STARTTLS und ohne
    impliziten TLS-Tunnel ein Klartext-Befund, waehrend ein Dienst ohne erkennbare
    Verschluesselungsfaehigkeit als nicht pruefbar gilt und keinen Befund ergibt.
texts:
  short: "POP3 oder IMAP ohne TLS-Zwang"
  plan:
    lever: "TLS für POP3 und IMAP erzwingen"
    effect: "Schützt Zugangsdaten und Nachrichten auf dem Übertragungsweg"
  observation:
    - when: service.starttls is False
      quantor: eines
      text: >-
        Auf {group} bietet der Mailabrufdienst keine Transportverschlüsselung vor der Anmeldung
        an: {affected}.
    - when: service.starttls is True
      quantor: eines
      text: >-
        Auf {group} bietet der Mailabrufdienst zwar STARTTLS an, nimmt eine Anmeldung aber
        schon vor dem Aufbau der Verschlüsselung entgegen: {affected}.
  meaning: >-
    Ohne STARTTLS oder eine gleichwertige Verschlüsselungspflicht übertragen POP3 und IMAP
    Anmeldedaten und Nachrichteninhalte im Klartext über das Netz. Jeder Mitleser auf dem
    Übertragungsweg kann Postfach-Zugangsdaten abgreifen und für weitere Zugriffe nutzen.
  recommendation:
    - stage: unverzueglich
      text: >-
        Auf dem Mailserver STARTTLS für POP3 und IMAP erzwingen oder die Klartextvarianten
        auf den betroffenen Ports deaktivieren und ausschließlich die verschlüsselten
        Varianten anbieten.
    - stage: in_kuerze
      text: >-
        Postfach-Zugangsdaten rotieren und die Zugriffsprotokolle auf unverschlüsselte
        Anmeldeversuche prüfen.
    - stage: mittelfristig
      text: >-
        Mail-Clients auf die verschlüsselten Abrufwege umstellen und die Klartextports
        anschließend schließen.
  verify: >-
    Verbindung zum Mailabrufdienst von außen aufbauen, bevor STARTTLS angefordert wird;
    erwartet wird die Ablehnung dieser unverschlüsselten Anmeldung.
  positive:
    title: POP3 und IMAP erzwingen TLS vor der Anmeldung
    text: >-
      Auf {group} lassen POP3 und IMAP eine Anmeldung erst nach aufgebauter
      Transportverschlüsselung zu.
