id: login_over_http_passive
title: Anmeldeseite laut Passivquelle über HTTP erreichbar
family: login_over_http
category: D
scale: hygiene
level: mittel
group_by: host
scope: passive
applicable_when: null
item_when: null
when: passive.source == "shodan" and passive.details["login_over_http"] is not None
# S6b-4 (spec/11 T11, E22): blauer Hinweis auf Hosts, die vom Pruefstand aus nicht erreichbar sind.
hint_when: host.reach is not None and host.reach.status in ["unreachable_from_scanner", "no_response"]
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [shodan]
kind: check
bundle: null
affected_template: "{host_ip}:{port} ({login_url}, laut Passivquelle)"
evidence: [passive]
references: [CWE-319, CWE-523]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: S6b-3 (spec/10 R19)
  start_level: mittel
  deviation: >-
    Passivfund, nicht bestätigt; die erste Empfehlung ist die Prüfung.
texts:
  short: "Anmeldung über HTTP laut Passivquelle"
  plan:
    lever: "Anmeldeseiten nur über HTTPS ausliefern"
    effect: "Schützt Zugangsdaten auf dem Übertragungsweg"
  observation:
    - text: >-
        Laut Passivquelle leitet {group} auf eine Anmeldeseite über eine unverschlüsselte Verbindung
        weiter: {affected}.
    - when: host.reach is not None and host.reach.status in ["unreachable_from_scanner", "no_response"]
      quantor: eines
      text: >-
        Der Host ist vom Prüfstand aus nicht erreichbar; die Angabe der Passivquelle ist deshalb
        nicht bestätigt.
    - when: host.reach is None or host.reach.status not in ["unreachable_from_scanner", "no_response"]
      quantor: eines
      text: >-
        Der Portscan hat das nicht bestätigt.
  meaning: >-
    Über HTTP gesendete Zugangsdaten lassen sich auf dem Übertragungsweg mitlesen.
  recommendation:
    - stage: in_kuerze
      text: >-
        Prüfen, ob die genannte Anmeldeseite noch über HTTP erreichbar ist, und sie
        ausschließlich über HTTPS ausliefern.
    - stage: mittelfristig
      text: >-
        Unverschlüsselte Aufrufe der Anwendung auf HTTPS umleiten.
  verify: >-
    Die genannte Adresse von außen über HTTP aufrufen; erwartet wird eine Weiterleitung auf
    HTTPS vor jeder Anmeldung.
