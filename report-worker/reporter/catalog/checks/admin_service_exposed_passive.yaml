id: admin_service_exposed_passive
title: Verwaltungsoberfläche laut Passivquelle erreichbar
family: admin_service_exposed
category: A
scale: exposure
level: erhoeht
group_by: host
scope: passive
applicable_when: null
when: passive.source == "shodan" and passive.verified is False and admin_fp(passive) and not is_cdn(host, services)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [shodan]
kind: check
bundle: admin_access
affected_template: "{host_ip}:{port} ({product_or_banner}, laut Passivquelle)"
evidence: [passive]
references: [CWE-284, CISA-KEV]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: Prototyp VS-002 (manuell, Passivquelle)
  start_level: hoch
  deviation: >-
    Entscheidung DC (S6b-2, Q13): ein Passivfund mit Kennung der Verwaltungssoftware ist
    Exposition erhoeht, nicht bestaetigt; die erste Empfehlung ist die Pruefung des Dienstes.
    Ohne Kennung (nur Port) entsteht kein Befund, die Meldung steht als Werkzeugmeldung im
    Anhang (admin_port_passive_unidentified).
texts:
  short: "Verwaltungsoberfläche laut Passivquelle"
  plan:
    lever: "Gemeldete Verwaltungszugänge prüfen und beschränken"
    effect: "Klärt, ob eine Verwaltungsoberfläche offen im Internet steht"
  # S6b-3 (spec/10 R9, R13): Texte je Variante. Ist die Verwaltungssoftware auf dem Host schon
  # aktiv erkannt, meldet die Passivquelle nur einen weiteren Port derselben Oberflaeche. Saetze
  # zu Anschluss, Firmware und Konten stehen nur bei Systemen des Kunden; auf einem geteilten
  # System richtet sich die Empfehlung an den Hoster.
  observation:
    - when: not any_admin_fp(services)
      quantor: eines
      text: >-
        Eine Passivquelle meldet für {group} eine Verwaltungsoberfläche, die der Portscan nicht
        bestätigen konnte: {affected}. Der Port liegt außerhalb der geprüften Ports oder war vom
        Scanner aus gefiltert.
    - when: any_admin_fp(services)
      quantor: eines
      text: >-
        Eine Passivquelle meldet auf {group} einen weiteren Port derselben Verwaltungsoberfläche,
        den der Portscan nicht bestätigen konnte: {affected}.
  meaning:
    - when: host.shared is None and host.betriebsform == "anschluss"
      quantor: eines
      text: >-
        Eine exponierte Verwaltungsoberfläche ist ein hochwertiges Ziel: Eine Übernahme betrifft
        den gesamten Anschluss mit den dahinter liegenden Systemen.
    - when: host.shared is None and host.betriebsform != "anschluss"
      quantor: eines
      text: >-
        Eine exponierte Verwaltungsoberfläche ist ein hochwertiges Ziel: Eine Übernahme betrifft
        das gesamte System und alle Dienste darauf.
    - when: host.shared is not None
      quantor: eines
      text: >-
        Eine Übernahme der Verwaltungsoberfläche beträfe alle Dienste auf diesem geteilten
        Server; abschalten oder beschränken kann sie nur der Betreiber.
    - when: not any_admin_fp(services)
      quantor: eines
      text: >-
        Ob es sich um ein Anmeldeportal oder die Administrationsoberfläche handelt, ist von außen
        nicht erkennbar.
  recommendation:
    - stage: in_kuerze
      when: host.shared is None
      quantor: eines
      text: >-
        Klären, welche Funktion auf dem gemeldeten Port läuft. Verwaltungsoberflächen dürfen
        nicht aus dem Internet erreichbar sein; Anmeldeportale nur mit Zwei-Faktor-Anmeldung und
        aktuellem Firmwarestand.
    - stage: in_kuerze
      when: host.shared is None
      quantor: eines
      text: >-
        Firmware gegen die Sicherheitshinweise des Herstellers abgleichen; lokale Benutzerkonten und
        Standardkonten prüfen.
    - stage: in_kuerze
      when: host.shared is not None
      quantor: eines
      text: >-
        Den gemeldeten Port prüfen und die Verwaltungsoberfläche auf die benötigten Quellnetze
        beschränken.
    - stage: mittelfristig
      when: host.shared is None
      quantor: eines
      text: >-
        Zugriff auf benötigte Quellnetze beschränken und Anmeldeversuche überwachen.
  verify: >-
    Verbindungsversuch auf den gemeldeten Port von einer externen Adresse; erwartet wird keine
    Verwaltungsanmeldung ohne Zugriffsbeschränkung.
