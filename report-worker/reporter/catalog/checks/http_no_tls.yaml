id: http_no_tls
title: Webdienst ohne Transportverschlüsselung erreichbar
family: http_no_tls
category: A
scale: exposure
level: erhoeht
group_by: host
scope: host
applicable_when: null
when: has_port(services, 80) and not has_port(services, 443) and not is_cdn(host, services)
positive_when: has_port(services, 443)
not_testable_when: []
undetermined: pass_silent
requires:
  tools: [nmap]
kind: check
bundle: null
affected_template: "{host_label}, Port 80 ohne Port 443"
evidence: [services]
references: [CWE-319, OWASP2025-A02]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: catalog_sim R-HTTP-NO-TLS
  start_level: erhoeht
  deviation: null
texts:
  observation: >-
    {n:Der Host|Die Hosts} {group} {n:bietet|bieten} einen Webdienst nur über unverschlüsseltes HTTP an; ein HTTPS-Dienst
    auf Port 443 fehlt: {affected}.
  meaning: >-
    Alle Inhalte und Eingaben laufen im Klartext über das Netz. In fremden Netzen kann jeder
    Mitleser Seiteninhalte verändern oder Formulareingaben abgreifen; Browser markieren die Seite
    als nicht sicher.
  recommendation:
    - stage: in_kuerze
      text: >-
        Ein Zertifikat einer anerkannten Zertifizierungsstelle einrichten und den Dienst über HTTPS
        anbieten; HTTP nur noch als Weiterleitung auf HTTPS betreiben.
    - stage: mittelfristig
      text: >-
        HSTS setzen, sobald alle Hostnamen dauerhaft HTTPS liefern.
  verify: >-
    Aufruf des Hostnamens über HTTPS von außen; erwartet wird eine gültige verschlüsselte
    Verbindung und eine Weiterleitung von HTTP auf HTTPS.
  positive:
    title: Webdienst mit Transportverschlüsselung
    text: >-
      {n:Der Host|Die Hosts} {group} {n:bietet seinen Webdienst|bieten ihre Webdienste} über HTTPS an.
