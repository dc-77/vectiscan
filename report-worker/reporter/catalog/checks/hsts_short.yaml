id: hsts_short
title: HTTP Strict Transport Security mit zu kurzer Gültigkeitsdauer
family: hsts_short
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: http
applicable_when: http is not None and http.hsts is not None and http.hsts.present is True
item_when: http.hsts is not None and http.hsts.present is True
when: http.hsts.max_age < HSTS_MIN_MAX_AGE
positive_when: http.hsts.max_age >= HSTS_MIN_MAX_AGE
not_testable_when:
  - when: http.hsts.max_age is None
    reason_code: insufficient_facts
    context: item
undetermined: not_testable
requires:
  tools: [header_check]
kind: check
bundle: tls_hardening
affected_template: "{fqdn} (max-age {hsts_max_age})"
evidence: [http]
references: [CWE-693]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-HDR-004
  start_level: INFO
  deviation: null
texts:
  short: "HSTS mit kurzer Gültigkeit"
  plan:
    lever: "Gültigkeitsdauer von HSTS verlängern"
    effect: "Verhindert unverschlüsselte Aufrufe der Webseite"
  observation: >-
    {n:Der Dienst|Die Dienste} {group} {n:setzt|setzen} den HTTP Strict Transport Security Header mit einer
    Gültigkeitsdauer, die unter dem empfohlenen Richtwert liegt: {affected}.
  meaning: >-
    Eine kurze Gültigkeitsdauer lässt den Schutz vor Downgrade-Angriffen bereits nach kurzer
    Zeit ohne erneuten Seitenaufruf ablaufen; wiederkehrende Besucher sind dann für einen
    Zeitraum wieder ungeschützt.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Gültigkeitsdauer des Strict-Transport-Security-Headers auf mindestens sechs Monate
        anheben.
  verify: >-
    HTTP-Antwortheader der Startseite von außen abrufen; erwartet wird ein gesetzter
    Strict-Transport-Security-Header mit einer Gültigkeitsdauer von mindestens sechs Monaten.
  positive:
    title: HTTP Strict Transport Security mit ausreichender Gültigkeitsdauer
    text: >-
      {n:Der Dienst|Die Dienste} {group} {n:setzt|setzen} den Header Strict-Transport-Security mit einer ausreichenden
      Gültigkeitsdauer.
