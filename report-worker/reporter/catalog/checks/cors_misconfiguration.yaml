id: cors_misconfiguration
title: Fehlerhafte CORS-Konfiguration
family: cors_misconfiguration
category: D
scale: hygiene
level: mittel
group_by: fqdn
scope: http.alerts
applicable_when: null
when: zap_match(alert, ZAP_CORS)
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [zap]
kind: check
bundle: web_header_hygiene
affected_template: "{fqdn} ({name})"
evidence: [http]
references: [CWE-942, CWE-346]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-CORS-001
  start_level: MEDIUM
  deviation: null
texts:
  observation: >-
    Die passive Webanalyse hat auf {group} eine zu weit gefasste Freigabe für
    ursprungsübergreifende Zugriffe (CORS) gefunden: {affected}.
  meaning: >-
    Erlaubt eine Antwort Zugriffe von beliebigen oder nicht vertrauenswürdigen Ursprungen,
    kann eine fremde Seite im Namen eines angemeldeten Nutzers Daten der Anwendung auslesen.
  recommendation:
    - stage: in_kuerze
      text: >-
        Die Freigabe für ursprungsübergreifende Zugriffe auf die tatsächlich benötigten
        Ursprunge einschränken und einen Platzhalter für beliebige Ursprunge entfernen,
        insbesondere in Verbindung mit Anmeldedaten.
  verify: >-
    Eine Anfrage mit einem fremden Ursprung an die betroffene Adresse stellen und den
    Antwortheader für die Zugriffsfreigabe prüfen; erwartet wird ein Wert, der nur die
    eigenen Ursprunge zulässt.
