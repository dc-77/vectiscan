id: ip_reputation
title: Öffentliche IP-Adresse mit auffälliger Reputationsbewertung
family: ip_reputation
category: E
scale: hygiene
level: mittel
group_by: host
scope: host
# S6b-2 (spec/09 Q12): Adressen von Plattformen und Inhaltsnetzen bewertet der Bericht nicht
# als Befund; Kapitel 3 nennt sie. Score 0 allein heisst nicht "keine Meldungen" (isWhitelisted).
# S6b-4 (spec/11 Teil 3 BS): der Positivbefund nennt sie mit (198.202.211.1 ohne Meldung).
# S6b-4n (spec/11 N6): nicht mehr. Die Reputation einer geteilten CDN- oder Plattformadresse ist
# nicht kundenbezogen (bergersysteme 198.202.211.1: Anycast mit Fremddomains); sie ist hier nicht
# anwendbar und steht weder als Befund noch im Positivbefund. Eine Meldung innerhalb des
# Abfragefensters von 90 Tagen (lastReportedAt) ist kein "keine Meldungen", auch bei totalReports 0.
applicable_when: host.cdn_provider is None and (host.shared is None or host.shared.kind != "platform")
item_when: null
when: host.reputation is not None and (host.reputation.abuseipdb_score >= ABUSEIPDB_FAIL_SCORE or host.reputation.urlhaus_compromised is True or host.reputation.greynoise_classification == "malicious")
positive_when: host.reputation is not None and host.reputation.abuseipdb_score == 0 and host.reputation.abuseipdb_total_reports == 0 and host.reputation.urlhaus_compromised is not True and host.reputation.otx_pulse_count in [0, None] and (host.reputation.abuseipdb_last_reported_at is None or days_until(scan.finished_at, host.reputation.abuseipdb_last_reported_at) > ABUSEIPDB_WINDOW_DAYS)
not_testable_when:
  - when: coverage_status("abuseipdb") != "ok"
    reason_code: coverage:abuseipdb
    context: group
undetermined: pass_silent
requires:
  tools: [abuseipdb]
kind: check
bundle: reputation_clean
affected_template: "{host_ip} (AbuseIPDB {abuseipdb_score})"
evidence: [host]
references: [CWE-284]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: neu (S2-Auftrag)
  start_level: mittel
  deviation: null
texts:
  short: "auffällige Reputation"
  plan:
    lever: "Ursache der Reputationsmeldungen beseitigen"
    effect: "Stellt das Vertrauen Dritter in die eigenen Adressen wieder her"
  observation: >-
    Externe Reputationsquellen führen die öffentliche Adresse von {group} als auffällig:
    {affected}. Die Bewertung stammt aus mehreren unabhängigen Quellen zu Missbrauchsmeldungen
    und Schadsoftware-Aktivität.
  meaning: >-
    Eine auffällige Reputationsbewertung deutet auf frühere Missbrauchsmeldungen, eine
    Kompromittierung oder eine Weiterverwendung der Adresse für Angriffsinfrastruktur hin.
    Andere Systeme können Verbindungen von einer so bewerteten Adresse automatisch blockieren
    oder als verdächtig einstufen.
  recommendation:
    - stage: in_kuerze
      text: >-
        Die eigenen Systeme auf dieser Adresse auf Schadsoftware und ungewöhnliche
        Netzwerkaktivität prüfen.
      effect: "Klärt, ob eigene Systeme die Meldungen verursachen"
    - stage: mittelfristig
      text: >-
        Nach Beseitigung der Ursache eine Löschung oder Korrektur der Bewertung bei den
        jeweiligen Reputationsquellen beantragen.
  verify: >-
    Erneute Abfrage gängiger Reputationsquellen für die betroffene Adresse; erwartet wird eine
    unauffällige Bewertung.
  positive:
    title: Keine Einträge in Reputationsquellen
    text: >-
      Für {group} liegen in den abgefragten Reputationsquellen keine Meldungen vor.
