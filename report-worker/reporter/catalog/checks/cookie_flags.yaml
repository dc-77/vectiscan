id: cookie_flags
title: Cookies ohne Sicherheits-Attribute
family: cookie_flags
category: D
scale: hygiene
level: niedrig
group_by: fqdn
scope: http.cookies
applicable_when: null
when: cookie.secure is False or cookie.httponly is False
positive_when: never
not_testable_when: []
undetermined: not_testable
requires:
  tools: [header_check]
kind: check
bundle: web_header_hygiene
affected_template: "{fqdn} ({name}: {flags_missing})"
evidence: [http]
references: [CWE-614, CWE-1004]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
policy:
  source: SP-COOK-001 bis SP-COOK-005
  start_level: MEDIUM bis INFO
  deviation: >-
    Sitzungs- und Tracking-Cookies sind von aussen nicht unterscheidbar; deshalb fuehrt diese
    Umsetzung fehlende Cookie-Attribute einheitlich als Hygiene niedrig, unabhaengig vom
    vermuteten Zweck des Cookies.
texts:
  short: "Cookies ohne Sicherheitsattribute"
  plan:
    lever: "Sicherheitsattribute für Cookies setzen"
    effect: "Erschwert das Abgreifen von Sitzungen über unverschlüsselte Aufrufe und Skripte"
  observation: >-
    Auf {group} setzen Cookies nicht alle Sicherheits-Attribute: {affected}.
  meaning: >-
    Ohne das Attribut Secure kann ein Cookie auch über eine unverschlüsselte Verbindung
    übertragen werden. Ohne HttpOnly kann clientseitiges Skript auf das Cookie zugreifen, etwa
    nach einer erfolgreichen Einschleusung von Fremdinhalten. Ohne SameSite kann das Cookie bei
    Anfragen von anderen Seiten mitgesendet werden.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die Attribute Secure, HttpOnly und SameSite für alle Cookies setzen, die eine Sitzung
        oder eine Anmeldung betreffen.
  verify: >-
    HTTP-Antwortheader Set-Cookie der Startseite von außen abrufen; erwartet werden die
    Attribute Secure, HttpOnly und SameSite bei jedem Cookie.
