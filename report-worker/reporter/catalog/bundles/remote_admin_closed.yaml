positive_title: Keine Windows-Fernwartung (RDP) und keine Windows-Dateifreigabe (SMB) aus dem Internet erreichbar
# S6a (Issue #30) nahm Hosts mit FTP, SSH ausserhalb 22 oder Verwaltungsoberflaeche aus dem
# Positivbefund. Seit dem Titel aus #30 nennt der Positivbefund nur RDP und SMB; ein anderer
# Dienst widerspricht ihm nicht. Entscheidung DC 26.09. (S6b-3, spec/10 R6): nur ein RDP- oder
# SMB-Port-Fakt nimmt einen Host heraus, und dann ist es ein Befund dieses Buendels.
