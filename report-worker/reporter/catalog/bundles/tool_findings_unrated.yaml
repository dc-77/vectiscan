id: tool_findings_unrated
title: Werkzeugbefunde ohne eigene Bewertung
category: E
merge_by: global
members: [info_disclosure, js_library_outdated]
target: appendix
references: [CWE-200]
frameworks:
  bsi: []
  nis2: []
  iso27001: []
  tr03116: []
texts:
  observation: >-
    Die eingesetzten Werkzeuge haben Beobachtungen gemeldet, die für sich genommen keine eigene
    Einstufung tragen: {affected}.
  meaning: >-
    Diese Meldungen beschreiben Hinweise, aus denen sich allein kein Angriff ableiten lässt. Sie
    stehen im Anhang, damit der Bericht nichts verschweigt, und gehören in die nächste
    Überarbeitung der betroffenen Anwendung.
  recommendation:
    - stage: mittelfristig
      text: >-
        Die genannten Hinweise bei der nächsten Überarbeitung der betroffenen Anwendung mit
        prüfen.
  verify: >-
    Die genannten Adressen erneut abrufen; erwartet wird, dass der jeweilige Hinweis nicht mehr
    auftritt.
